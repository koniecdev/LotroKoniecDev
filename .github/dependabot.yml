# Dependabot — automated dependency freshness (audit #0001 / H1).
# Keeps the auth server and the four shipped images on patched dependencies, and surfaces newer
# action versions to pin against (the SHA-pinning follow-up, H6).
#
# Target shape: exactly ONE pull request per ecosystem per week -- nuget, github-actions, docker.
# Three is the floor, not a preference: Dependabot raises pull requests per ecosystem and cannot
# combine across them. Every group below therefore matches "*" with no `update-types` filter, so
# nothing can fall outside a group and earn a pull request of its own.
# The fourth entry, docker-compose, is the one exception and needs no group. It allows a single
# image (caddy), so it opens at most one pull request, and only in a week when Caddy publishes a new
# image. A normal week still brings three. That pull request also carries `on-hold`, so /merge-train
# leaves it for the owner to read (ADR-0060 §4).
#
# Security updates are deliberately NOT grouped (that needs `applies-to: security-updates`). They
# should keep arriving as their own immediate pull requests -- a CVE fix must never sit behind a
# broken major in a batch of thirty.
version: 2

updates:
  # .NET packages — versions are centrally managed in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # ONE pull request for every nuget update, majors included. Omitting `update-types` is what
      # does it: with the old ["minor","patch"] restriction a major matched no group at all and got
      # its own PR (#511 NSubstitute, #510 Npgsql+Serilog, #234, #233), so a quiet week still
      # produced four or five. Dependabot cannot merge across ecosystems, so three PRs a week --
      # nuget, github-actions, docker -- is the floor, and this brings us to it.
      # Trade-off, accepted deliberately: one breaking major now blocks the whole batch and there is
      # no way to merge the good half. The fix is an `ignore` entry for the offender (see below for
      # the working example), after which Dependabot rebuilds the PR without it.
      nuget:
        patterns: ["*"]
    ignore:
      # Microsoft.OpenApi 3.x cannot build on ASP.NET Core 10. Microsoft.AspNetCore.OpenApi 10.0.9
      # (the whole 10.x line) depends on Microsoft.OpenApi 2.0.0, and its bundled XmlCommentGenerator
      # emits `mediaType.Example = …` — a property 3.x turned read-only on IOpenApiMediaType, so the
      # generated file fails with CS0200 in both API projects (PR #390). The only reason dependabot
      # sees Microsoft.OpenApi at all is the direct 2.x pin that forces the GHSA-v5pm-xwqc-g5wc fix
      # into the graph. Drop this ignore when the apps move to .NET 11 (its preview OpenApi packages
      # are the first built against 3.x). Minor/patch 2.x updates still flow through the group above.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  # GitHub Actions referenced across every workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Container base images for the deployed services (root migrator/test images + the three apps).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/src/AuthSystem/LotroKoniecDev.AuthSystem.API"
      - "/src/TranslationSystem/LotroKoniecDev.TranslationSystem.API"
      - "/src/Frontend/LotroKoniecDev.Frontend"
    schedule:
      interval: "weekly"
    groups:
      docker-base-images:
        patterns: ["*"]

  # Caddy, the proxy in front of both servers (#1001). Its image is only in compose files, which the
  # `docker` entry above does not read. How its pull request moves the pins: the comment above
  # `x-caddy-image` in compose.hetzner.yaml.
  # Only caddy, on purpose. Every other compose image is a separate decision: a postgres major needs
  # a data migration. The ghcr.io app images take their tag from variables, and Dependabot skips them.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    # A pull request that changes only compose files runs no CI check, so nothing proves a new Caddy
    # before it reaches both servers (#988). `on-hold` makes /merge-train skip it. The owner reads
    # the release, then removes the label. These names replace Dependabot's default labels, and a
    # name that does not exist in the repo is dropped without a warning, so each one must exist.
    labels: ["dependencies", "docker", "on-hold"]
    allow:
      - dependency-name: "caddy"
    ignore:
      # 2.11.6 crashes the proxy (#988). This also covers the `2.11.6-alpine` tag we would pin:
      # Dependabot compares only the version part of a tag and drops the `-alpine` suffix.
      - dependency-name: "caddy"
        versions: ["2.11.6"]
