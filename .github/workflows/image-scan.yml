name: Image scan

# cd.yml scans an image once, when it builds it. A vulnerability published after that build stays
# invisible until some later change rebuilds the image (#1326). This workflow scans again, every day,
# the images the servers run, with the same Trivy gate as cd.yml. It has two halves:
#
#   * Our own four images (`scan`), as each environment deployed them.
#   * The third-party images (`third-party-*`, ADR-0076): Caddy, RabbitMQ and the backup's postgres,
#     read from compose.hetzner.yaml and scripts/hetzner/backup.sh at each environment's deployed
#     commit, and the observability stack, read from compose.observability.yaml on the run's ref.
#     A finding no vendor release fixes yet goes into that image's exception file under
#     .github/trivy/, with a reason and an expiry. Our own images never read those files.
#
# Prod promotion is batched, so prod can run older images than main. That is why both halves read
# what each environment deployed, not main.
#
# Known gaps:
#   * The deployment record can name a different commit than the box runs (#1521). A cd.yml dispatch
#     with an explicit image_tag records the run's commit, not the tag it rolled out; a deploy or
#     rollback run by hand on the box (runbook, "Deploy or roll back by hand") leaves no record at
#     all. After either, both halves read the commit the newest successful record names.
#   * The observability stack is deployed by hand (ADR-0050 §2) and leaves no record, so its half
#     reads the pins on the run's ref. A box that missed a hand deploy still runs the older images.
#
# A failed scheduled run e-mails the user who last changed the cron line, like health-ping.yml. It is
# one e-mail per run, so a red leg left standing hides the next one. Cron is UTC.

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the deployed image tags
    if: github.repository == 'koniecdev/LotroKoniecDev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      deployments: read
    outputs:
      staging: ${{ steps.tags.outputs.staging }}
      production: ${{ steps.tags.outputs.production }}
      staging_commit: ${{ steps.tags.outputs.staging_commit }}
      production_commit: ${{ steps.tags.outputs.production_commit }}
    steps:
      # The same rule as resolve_via_api in scripts/ci/resolve-prod-baseline.sh: the newest deployment
      # that ever reached `success`. A newer success marks the older one `inactive`, so the latest
      # status alone would find nothing. --paginate, because a long prod promotion pause pushes the
      # last success past the first 100 records.
      - name: Find the newest successful deployment of each environment
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          images="lotrokoniecdev-auth-api lotrokoniecdev-tms-api lotrokoniecdev-frontend lotrokoniecdev-migrator"
          echo '## Deployed images' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for environment in staging production; do
            sha=''
            deployments="$(gh api --paginate "repos/${REPO}/deployments?environment=${environment}&per_page=100" --jq '.[] | "\(.id) \(.sha)"')"
            while read -r id deployment_sha; do
              [ -n "$id" ] || continue
              states="$(gh api "repos/${REPO}/deployments/${id}/statuses?per_page=100" --jq '.[].state')"
              if grep -qx 'success' <<< "$states"; then
                sha="$deployment_sha"
                break
              fi
            done <<< "$deployments"
            if [ -z "$sha" ]; then
              echo "::error::No ${environment} deployment ever reached success, so there is nothing known to scan."
              failed=1
              continue
            fi
            # Written before the GHCR check: the third-party half reads files at this commit, and
            # a missing image of our own does not change which files the box got.
            echo "${environment}_commit=${sha}" >> "$GITHUB_OUTPUT"
            tag="sha-${sha:0:7}"
            # The tag is published only when all four images exist, so a missing image fails the
            # legs at their clear check step, not with a Trivy pull error.
            missing=0
            for image in $images; do
              if ! docker buildx imagetools inspect "${IMAGE_PREFIX}/${image}:${tag}" > /dev/null; then
                echo "::error::${IMAGE_PREFIX}/${image}:${tag} is not in GHCR, although the ${environment} deployment record names commit ${sha}."
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              failed=1
              continue
            fi
            echo "${environment}=${tag}" >> "$GITHUB_OUTPUT"
            # The backticks are markdown for the job summary, not command substitution.
            # shellcheck disable=SC2016
            printf -- '- **%s**: `%s` (commit %s)\n' "$environment" "$tag" "$sha" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

  # Runs even when resolve failed, so an environment that could not resolve does not hide the
  # other one. Each leg of an environment without a tag fails at its first step.
  scan:
    name: Scan ${{ matrix.environment }} / ${{ matrix.image }}
    needs: resolve
    if: ${{ !cancelled() && github.repository == 'koniecdev/LotroKoniecDev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
        image:
          - lotrokoniecdev-auth-api
          - lotrokoniecdev-tms-api
          - lotrokoniecdev-frontend
          - lotrokoniecdev-migrator
    steps:
      - name: Check that the environment resolved
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          TAG: ${{ needs.resolve.outputs[matrix.environment] }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::No image tag for ${ENVIRONMENT}. The resolve job says why."
            exit 1
          fi

      - name: Scan image for vulnerabilities (Trivy — fail HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.resolve.outputs[matrix.environment] }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # Builds the third-party matrix (ADR-0076). It always writes one: a deployed commit or a file it
  # cannot read becomes a leg that fails at its first step, so every other image is still scanned.
  third-party-list:
    name: List the third-party images
    needs: resolve
    if: ${{ !cancelled() && github.repository == 'koniecdev/LotroKoniecDev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deployed commits are older commits of main, read with `git show`.
          fetch-depth: 0
          persist-credentials: false

      - name: List the images each environment runs
        id: list
        env:
          STAGING_COMMIT: ${{ needs.resolve.outputs.staging_commit }}
          PRODUCTION_COMMIT: ${{ needs.resolve.outputs.production_commit }}
        run: |
          set -euo pipefail
          matrix="$(./scripts/ci/list-third-party-images.sh --matrix "staging=${STAGING_COMMIT}" "production=${PRODUCTION_COMMIT}")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo '## Third-party images' >> "$GITHUB_STEP_SUMMARY"
          # The backticks are markdown for the job summary, not command substitution.
          # shellcheck disable=SC2016
          jq -r '.include[] | "- `\(.leg)`" + (if .error != "" then ": \(.error)" else "" end)' <<< "$matrix" >> "$GITHUB_STEP_SUMMARY"

  # The `if` names the list job's result instead of the default success(), which also counts resolve:
  # one environment that fails to resolve must not stop the legs of the other one.
  third-party-scan:
    name: Scan third-party / ${{ matrix.leg }}
    needs: third-party-list
    if: ${{ !cancelled() && needs.third-party-list.result == 'success' && github.repository == 'koniecdev/LotroKoniecDev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.third-party-list.outputs.matrix) }}
    steps:
      - name: Check that the image could be listed
        env:
          LEG_ERROR: ${{ matrix.error }}
        run: |
          if [ -n "$LEG_ERROR" ]; then
            echo "::error::${LEG_ERROR}"
            exit 1
          fi

      - name: Check out the exception files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/trivy
          persist-credentials: false

      # No registry credentials: these are public Docker Hub images, and a token handed to Trivy
      # would go to Docker Hub (ADR-0067 §7). `scanners: vuln`, because the action's default adds
      # the secret scanner, and a secret inside a vendor's image is nothing we can rotate.
      - name: Scan image for vulnerabilities (Trivy — fail HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln
          trivyignores: ${{ matrix.ignore }}
