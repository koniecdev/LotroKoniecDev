# LotroKoniecDev alert rules (#713) — the project-scoped half.
#
# ADR-0034 §Consequences named exactly what the Azure migration deleted: "the Azure Monitor alert
# rules (replica restart, 5xx spike, memory/CPU saturation, log-error spike)". Three of the four are
# project-scoped and live here; box saturation is not ours alone and lives in fleet-alerts.yaml.
# The two translation save rules at the end come from #687 (ADR-0072).
#
# Both projects run on the same boxes, so every rule here is scoped to `lotrokoniecdev` — by
# `service_namespace` for app metrics and `project` for logs and container metrics. TheKittySaver
# ships the mirror-image set from its own repo (koniecdev/TheKittySaver#511).
#
# Delivery reuses the single `owner-email` contact point. There is deliberately no second channel.
apiVersion: 1

groups:
  - orgId: 1
    name: lotrokoniecdev
    folder: LotroKoniecDev
    interval: 1m
    rules:

      - uid: lotro-crash-loop
        title: LOTRO — container is crash-looping
        condition: C
        for: 5m
        labels:
          project: lotrokoniecdev
          severity: page
        annotations:
          summary: '{{ $labels.name }} restarted repeatedly on {{ $labels.environment }}'
          description: >-
            This container's CPU counter reset more than once in the last 15 minutes, which means
            Docker restarted it in place more than once — a crash-loop, not a deploy. On this fleet
            containers run for weeks, so two unexplained in-place restarts inside fifteen minutes is
            already abnormal. This is the failure the daily health ping cannot see: between two pings
            a container can die and come back indefinitely with nobody watching, which is exactly the
            gap ADR-0050 exists to close.
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              # A counter RESET is the signal, not the start time. cadvisor reports
              # container_start_time_seconds as the container's CREATION time, so it does not move
              # when `restart: unless-stopped` brings a crashed container back in place — which is
              # the case this rule exists for. Verified on lotro-staging: three deliberate restarts
              # left changes(container_start_time_seconds[15m]) at 0 while
              # resets(container_cpu_usage_seconds_total[20m]) read 3.
              #
              # Counting resets also ignores deploys for free: recreating a container mints a new
              # container id, so a rollout starts a NEW series rather than resetting this one.
              #
              # The threshold is >1, not >2, because resets() UNDERCOUNTS. It can only see a restart
              # if a scrape lands between two of them, so restarts closer together than the 30 s
              # scrape interval coalesce. Measured on staging: three deliberate restarts 85 s apart
              # were still counted as 2. A real crash-loop restarts faster than that, so a rule that
              # demanded three observed resets would be the least likely to fire exactly when it
              # matters most.
              expr: >-
                max by (name, environment) (resets(container_cpu_usage_seconds_total{project="lotrokoniecdev", name!=""}[15m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error

      - uid: lotro-5xx-rate
        title: LOTRO — 5xx rate above 5%
        condition: C
        for: 5m
        labels:
          project: lotrokoniecdev
          severity: page
        annotations:
          summary: '{{ $labels.service_name }} is returning 5xx on {{ $labels.deployment_environment }}'
          description: >-
            More than 5% of the requests this service served in the last 10 minutes failed with a
            5xx. Measured from the app's own OTLP metrics, so it counts what actually reached the
            app rather than what the shared Caddy saw. Start from the error-log panel on the
            LotroKoniecDev dashboard and follow a line's TraceID.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              # The `or 0 *` term gives a service with traffic and NO 5xx an explicit zero. Without
              # it the numerator is an empty vector, the division yields nothing, and the rule sits
              # in NoData — which at a glance is indistinguishable from a rule that is broken.
              expr: >-
                (
                  sum by (service_name, deployment_environment) (rate(http_server_request_duration_seconds_count{service_namespace="lotrokoniecdev", http_response_status_code=~"5.."}[10m]))
                  or 0 * sum by (service_name, deployment_environment) (rate(http_server_request_duration_seconds_count{service_namespace="lotrokoniecdev"}[10m]))
                )
                / clamp_min(sum by (service_name, deployment_environment) (rate(http_server_request_duration_seconds_count{service_namespace="lotrokoniecdev"}[10m])), 0.001)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error

      - uid: lotro-error-log-spike
        title: LOTRO — error-level log rate spike
        condition: C
        for: 5m
        labels:
          project: lotrokoniecdev
          severity: warning
        annotations:
          summary: '{{ $labels.container }} is logging errors on {{ $labels.environment }}'
          description: >-
            More than one error- or fatal-level line per second over five minutes. This is the one
            of the four restored rules that catches failures which never become a 5xx — a background
            worker that cannot reach the broker, a retry loop, an outbox that will not drain.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              instant: true
              queryType: instant
              editorMode: code
              # Matches Serilog's CompactJsonFormatter level field. Caddy, RabbitMQ and the migrator
              # log plain text and are deliberately not matched here: their failure modes surface as
              # crash-loops or 5xx, and a text-level regex across them is a false-positive machine.
              expr: >-
                sum by (container, environment) (rate({project="lotrokoniecdev"} |~ `(?i)"@l":"(error|fatal)"` [5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error

      # The per-account save budget of ADR-0072 (#687). One alert instance per account, budget and
      # outcome, so a second account, or a refusal after the threshold mail, sends a mail of its own.
      - uid: lotro-translation-save-budget
        title: LOTRO — a translator account reached its save budget
        condition: C
        for: 0s
        labels:
          project: lotrokoniecdev
          severity: warning
        annotations:
          summary: 'Translator {{ $labels.TranslatorId }}: {{ $labels.Budget }} budget, {{ $labels.Outcome }}, on {{ $labels.environment }}'
          description: >-
            A non-admin account made many translation saves (Budget Saves) or replaced existing Polish
            many times (Budget Overwrites) in the budget window. AlertThreshold means it passed the
            alert threshold and can still save; Refused means tms-api refused a save with 429. A
            hijacked account or a script looks like this; so does an honest translator after a large
            game update. The mail names the account by its translator id; the runbook (Observability,
            "The two translation save rules") shows how to turn it into a name. The first mail comes within
            about 90 seconds, or up to 5 minutes when another instance of this rule already fired. A
            "resolved" mail follows about an hour after the account's last budget line, which does
            not mean the account is back under its limit: the budget window is 24 hours by default.
            A new mail follows when the account saves above the threshold again, and a repeat every
            6 hours only while it keeps saving every hour.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              instant: true
              queryType: instant
              editorMode: code
              # Anchored on the template key, not the bare text: tms-api writes a caller's
              # X-Correlation-ID header and request path into its log lines, and a bare-text filter
              # would let any anonymous request fire this rule. The text comes from
              # TranslationSaveBudgetLogText, and a unit test ties the two together.
              expr: >-
                sum by (environment, TranslatorId, Budget, Outcome) (count_over_time({project="lotrokoniecdev", container=~".*tms-api.*"} |= `"@mt":"Translation save budget:` | json TranslatorId="TranslatorId", Budget="Budget", Outcome="Outcome" [1h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error

      # The nightly database backup (#688, ADR-0071). backup.sh on the prod box writes the metric
      # only after every database landed in the bucket, and the agent's host exporter reads it.
      - uid: lotro-backup-missing
        title: LOTRO — the nightly database backup did not land
        condition: C
        for: 5m
        labels:
          project: lotrokoniecdev
          severity: page
        annotations:
          summary: 'No good database backup from {{ $labels.box }} in the last 26 hours'
          description: >-
            The last run of /opt/lotro/backup.sh that landed every database is more than 26 hours
            old, or its metric is gone. Until a run succeeds, nothing older than Neon's history
            window can be restored. Read the last runs with `journalctl -t lotro-backup` on the
            prod box, then run `bash /opt/lotro/backup.sh` there by hand (runbook → Database
            backups). If "a box has gone silent" fires for the prod box too, this one only repeats it.
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              # Self-arming, like the silent-box rule: the metric starts to count after the first
              # good run, which the wiring does by hand, so the rule can ship before the bucket.
              # A metric that disappears keeps paging for 14 days, as far back as Prometheus keeps
              # samples (15d, compose.observability.yaml); then the rule goes quiet (ADR-0071 §7).
              # `by (box)` keeps the label the summary prints.
              expr: >-
                (
                  time() - max by (box) (lotro_backup_last_success_timestamp_seconds{box="lotro-prod"}) > 26 * 3600
                ) or (
                  absent_over_time(lotro_backup_last_success_timestamp_seconds{box="lotro-prod"}[30m])
                  and on() count(count_over_time(lotro_backup_last_success_timestamp_seconds{box="lotro-prod"}[14d])) > 0
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error

  # A 24-hour query is heavier than the one-minute group needs, and a total over a day does not
  # change much in five minutes.
  - orgId: 1
    name: lotrokoniecdev-daily
    folder: LotroKoniecDev
    interval: 5m
    rules:

      # The owner's total alert on #687: overwrites from all accounts together, admins included, so
      # several accounts that each stay under their own budget still show up. It never blocks a
      # save. The threshold (100 in 24 hours) is set here, not in the box .env: change it in this
      # file and sync /opt/obs.
      - uid: lotro-translation-overwrites-total
        title: LOTRO — more than 100 translations overwritten in 24 hours
        condition: C
        for: 0s
        labels:
          project: lotrokoniecdev
          severity: warning
        annotations:
          summary: 'More than 100 saves replaced existing Polish in 24 hours on {{ $labels.environment }}'
          description: >-
            Saves that replaced Polish text already on a row, from all accounts together, admins
            included, passed 100 in the last 24 hours. One account, several accounts or an admin's
            own corrections can cause it; the per-account budget rule names an account when one
            passes its own threshold. Look at the "Translation overwritten:" lines of tms-api in
            Grafana to see who saved what. This sends one mail when the total passes 100, a repeat
            every 6 hours while the 24-hour total stays above it, and a resolved mail when it drops.
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              instant: true
              queryType: instant
              editorMode: code
              # Anchored on the template key for the same reason as the budget rule above.
              expr: >-
                sum by (environment) (count_over_time({project="lotrokoniecdev", container=~".*tms-api.*"} |= `"@mt":"Translation overwritten:` [24h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [100] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
