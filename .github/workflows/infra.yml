name: Infra (Terraform)

# Terraform lifecycle for the Azure infra in iac/ (ADR-0012):
#   * PR touching iac/**            → terraform fmt-check + validate + PLAN (read-only preview in the
#                                     run summary; the PR gate for infra changes).
#   * push to main touching iac/**  → terraform APPLY: staging auto-applies, prod requires approval.
#   * workflow_dispatch             → manual APPLY behind the same gates.
#
# Auth: Azure OIDC federation via azure/login (SHA-pinned in each step) — no stored client secret; the
# azurerm provider AND the azurerm state backend both authenticate via the resulting Azure CLI session
# (use_cli default).
# App secrets are NOT Terraform inputs anymore: they live in Azure Key Vault and the ACA apps read them
# via a managed identity (ADR-0013), so only the non-secret inputs (iac/vars.tf) arrive as TF_VAR_*
# from repo VARIABLES. The rolling container image is NOT managed here — cd.yml owns it and the ACA
# resources ignore image drift (lifecycle.ignore_changes).
on:
  pull_request:
    branches: ["main"]
    paths:
      - "iac/**"
      - ".github/workflows/infra.yml"
  push:
    branches: ["main"]
    paths:
      - "iac/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Azure OIDC federation

# Concurrency is per-JOB, not workflow-wide (audit 0001 M12): the read-only `plan` stays on a
# per-ref-per-env group while `apply-staging` holds `staging-mutation` and `apply-prod` holds the
# `prod-mutation` group (shared with cd.yml deploy-prod), so Terraform and the app rollout can never
# mutate the same resources concurrently. Never cancel an in-flight apply.

env:
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # Terraform input variables (iac/vars.tf) — non-secret only. App secrets live in Key Vault (ADR-0013),
  # read at runtime by the ACA managed identity, so no TF_VAR_* carries a secret. TF_VAR_<name> is
  # case-sensitive — keep the var name lowercase.
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_smtp_sender_email: ${{ vars.SMTP_SENDER_EMAIL }}
  TF_VAR_admin_username: ${{ vars.ADMIN_USERNAME }}
  TF_VAR_admin_email: ${{ vars.ADMIN_EMAIL }}

jobs:
  plan:
    name: terraform plan (${{ matrix.env }})
    # Activation switch (see runbook): until CD_ENABLED=true the Azure-touching jobs are skipped, so
    # an iac/** PR stays green before the one-time OIDC/secret setup is done. Dependabot PRs are also
    # skipped: they run without repository secrets, so the Azure OIDC login (client-id/tenant-id) can
    # never succeed there — and granting them Azure access would be a privilege escalation anyway.
    if: vars.CD_ENABLED == 'true' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - env: prod
            backend: prod.hcl
            var_file: ''
          - env: staging
            backend: staging.hcl
            var_file: '-var-file=env/staging.tfvars'
    # Read-only plan: serialize per ref + env, independent of the mutation groups — a plan never mutates
    # resources, so it must neither block nor queue behind a rollout/apply. No-cancel matches the apply jobs.
    concurrency:
      group: infra-plan-${{ github.ref }}-${{ matrix.env }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: iac
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false -reconfigure -backend-config=backend-config/${{ matrix.backend }}

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -lock-timeout=300s ${{ matrix.var_file }} | tee plan.txt
          {
            echo '### Terraform plan (${{ matrix.env }})';
            echo '```';
            tail -c 60000 plan.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  apply-staging:
    name: terraform apply (staging)
    if: vars.CD_ENABLED=='true' && vars.STAGING_ENABLED=='true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: staging-mutation
      cancel-in-progress: false
    environment:
      name: staging
    defaults:
      run:
        working-directory: iac
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7

      - name: terraform init
        run: terraform init -input=false -reconfigure -backend-config=backend-config/staging.hcl

      - name: terraform apply
        run: terraform apply -input=false -auto-approve -lock-timeout=300s -var-file=env/staging.tfvars

  apply-prod:
    name: terraform apply (prod)
    if: always() && vars.CD_ENABLED=='true' && github.event_name != 'pull_request' && (needs.apply-staging.result=='success' || needs.apply-staging.result=='skipped')
    needs: apply-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Shared mutation lock with the cd.yml prod rollout (audit 0001 M12): `apply-prod` and `deploy-prod`
    # share the `prod-mutation` group so Terraform and the app rollout never mutate the same prod
    # resources concurrently. Never cancel an in-flight apply (state-lock also guards correctness); a
    # competing rollout/apply queues until this finishes.
    concurrency:
      group: prod-mutation
      cancel-in-progress: false
    # Same approval gate as the app rollout — a human approves before live infra changes.
    environment:
      name: production
    defaults:
      run:
        working-directory: iac
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7

      - name: terraform init
        run: terraform init -input=false -reconfigure -backend-config=backend-config/prod.hcl

      - name: terraform apply
        run: terraform apply -input=false -auto-approve -lock-timeout=300s
