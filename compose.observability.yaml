# Observability stack for the Hetzner fleet — the first cut of epic #707, decided by ADR-0050.
#
# This is deliberately NOT a service block inside compose.hetzner.yaml. That file is a CD artifact:
# deploy.sh overwrites it and runs `up -d --remove-orphans` on every rollout, which would tie the
# lifetime of the monitoring to the lifetime of the thing it monitors (ADR-0050 §2). This file is
# its own compose project, lives in /opt/obs, and is deployed by hand.
#
# ONE file serves both roles; the env file next to it picks which (see .env.observability.example):
#
#   staging box  COMPOSE_PROFILES=backend   Grafana + Loki + Prometheus + Tempo + Alloy
#   prod box     COMPOSE_PROFILES=          Alloy only, pushing to the backend on staging through
#                                           the obs.<domain> ingest vhost (ADR-0050 §4, #755)
#
# The same switch picks the agent's "ship" file: alloy/ship.backend.alloy writes to the backend
# containers next door in plain HTTP/gRPC, alloy/ship.agent.alloy crosses the box boundary over TLS
# with one basic-auth credential. Everything else about the agent is identical on both boxes.
#
# The backend runs on STAGING on purpose. A backend co-hosted with the workload it observes dies in
# the same outage and takes the evidence with it; on staging, a prod outage — the one that matters —
# leaves the dashboards and prod's last minutes of telemetry readable (ADR-0050 §1).
#
# NOTHING here is published to the internet by THIS file:
#   * Grafana binds to 127.0.0.1 on the box. Reach it with an ssh tunnel:
#       ssh -L 3000:127.0.0.1:3000 lotro-staging   → http://localhost:3000
#     The only public entry point is the ingest vhost the LotroKoniecDev Caddy serves on the backend
#     box — three push paths, one source /32, one credential, everything else a 404 (ADR-0050 §4).
#     Grafana is deliberately not behind it (runbook → "Observability & monitoring").
#   * Alloy's OTLP receiver binds to OBS_OTLP_BIND_ADDRESS, which is a DOCKER BRIDGE GATEWAY
#     (10.61.0.1 = the tks network's gateway on the staging box), never 0.0.0.0. A published port
#     on 0.0.0.0 would be reachable from the internet: Docker's iptables rules are inserted ahead
#     of ufw, so `ufw deny` does not cover a published port (bootstrap.sh:286).
#   * Loki, Prometheus and Tempo publish nothing at all; Grafana, Alloy and — for the other box's
#     pushes — Caddy reach them over the `obs` network.
#
# No container here joins `default` or `tks`. Alloy reads the Docker socket and /proc — it never
# needs a route to an application container, and it must not have one (ADR-0050 §3: the cross-stack
# pivot #506 closed does not get reopened under a friendlier name). The `obs` network itself belongs
# to the LotroKoniecDev stack (`${COMPOSE_PROJECT_NAME}_obs`, joined here as external) so that Caddy
# can sit on it — the same shape as `tks`, and the reason that stack must have deployed at least
# once since #755 before this project can start.

name: obs

services:
  # ---------------------------------------------------------------------------------------------
  # Agent — runs on EVERY box. Three jobs: tail every container's stdout, accept OTLP from the
  # apps, and scrape the host and the containers.
  # ---------------------------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: obs-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # A directory, not a file: Alloy loads every *.alloy in it — config.alloy (the same on every
      # box) plus the role's ship file, mounted as ship.alloy below.
      - /etc/alloy
    environment:
      # The two labels every signal off this box carries. `environment` is the ONLY thing that
      # separates staging from prod in Grafana — both boxes run ASPNETCORE_ENVIRONMENT=Production.
      OBS_BOX: ${OBS_BOX:?OBS_BOX must be set (lotro-staging | lotro-prod)}
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:?OBS_ENVIRONMENT must be set (staging | production)}
      # Agent-only boxes: the backend's public hostname and the credential its Caddy checks
      # (ship.agent.alloy). Blank on the backend box, whose ship file never reads them.
      OBS_BACKEND_HOST: ${OBS_BACKEND_HOST:-}
      OBS_PUSH_USER: ${OBS_PUSH_USER:-}
      OBS_PUSH_PASSWORD: ${OBS_PUSH_PASSWORD:-}
    ports:
      # OTLP in, from the application containers. Bound to bridge GATEWAYS, never 0.0.0.0 and never
      # the public IP: a port published on 0.0.0.0 is reachable from the internet regardless of ufw,
      # because Docker inserts its DNAT rules ahead of the ufw chain.
      #
      # Two of them, because the two stacks sit on two segregated networks and Alloy joins neither
      # (ADR-0050 §3 - an agent that could reach an app container is the cross-stack pivot #506
      # closed). Each stack reaches the agent through its own gateway instead:
      #   OBS_OTLP_BIND_LOTRO = 10.60.0.1  → our own apps
      #   OBS_OTLP_BIND_TKS   = 10.61.0.1  → the guest TheKittySaver stack
      # The defaults differ only so that an unset pair does not collide on one loopback port.
      - "${OBS_OTLP_BIND_LOTRO:-127.0.0.1}:4317:4317"
      - "${OBS_OTLP_BIND_LOTRO:-127.0.0.1}:4318:4318"
      - "${OBS_OTLP_BIND_TKS:-127.0.0.2}:4317:4317"
      - "${OBS_OTLP_BIND_TKS:-127.0.0.2}:4318:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # The role's ship file, picked by the SAME switch that picks the role: COMPOSE_PROFILES is
      # `backend` on the backend box and empty on an agent-only box, and `:-agent` turns that empty
      # into ship.agent.alloy. One switch, so the two cannot disagree.
      - ./alloy/ship.${COMPOSE_PROFILES:-agent}.alloy:/etc/alloy/ship.alloy:ro
      # Read-only socket: the log tailer and the cadvisor exporter both read container state
      # through it. Read-only is not a real security boundary (the socket is root-equivalent by
      # design) but it does stop this container from creating or killing one by accident.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cadvisor needs containerd too, not just Docker: with the overlayfs storage driver it
      # asks containerd for the container metadata, and without this socket it fails EVERY
      # docker cgroup with "cannot unix dial containerd api service" — while still happily
      # reporting the host's systemd slices, so the scrape looks alive and simply has no
      # containers in it.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      # Two exporters, two mount conventions, and they are NOT interchangeable:
      #   * the unix (node) exporter is pointed at /host/* by its own path options;
      #   * the embedded cadvisor has no path options — it reads /sys/fs/cgroup and
      #     /var/lib/docker at their REAL paths. Give it only /host/sys and it discovers exactly
      #     one cgroup (the root), which looks like "metrics are working" right up until you try
      #     to break them down per container.
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - obs
    # 512m, not 256m as ADR-0050 predicted: Alloy is the heaviest component here, not the
    # lightest. It carries the cadvisor exporter across every container on the box AND the
    # whole OTLP pipeline for both projects, and it grew from 144 MiB to 285 MiB the moment
    # the second project started exporting. It also gets the most headroom on purpose: it is
    # the one component whose death stops ALL telemetry, and stops it silently.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------------------------
  # Backend — staging box only (COMPOSE_PROFILES=backend).
  # ---------------------------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.7
    container_name: obs-loki
    profiles: ["backend"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - obs
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: obs-prometheus
    profiles: ["backend"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Two caps, whichever hits first. The SIZE cap is the one that matters: it is enforced by the
      # store, so no upstream mistake can make Prometheus outgrow it (ADR-0050 §8).
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      # Alloy pushes; Prometheus scrapes nothing. Scraping an app container would put this process
      # on an application network, which is exactly what ADR-0050 §3 forbids.
      - --web.enable-remote-write-receiver
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - obs
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    image: grafana/tempo:2.10.8
    container_name: obs-tempo
    profiles: ["backend"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - obs
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The backend role's fail-fast, moved OUT of `${VAR:?}` interpolation on purpose: compose
  # interpolates every service before it applies profiles, so a required-variable guard on a
  # backend-only service also breaks the agent-only role, which never starts that service — found
  # the first time that role was exercised (#755). This one-shot runs only under the backend profile
  # and grafana waits for it, so the backend box still refuses to come up half-configured while an
  # agent-only box never hears about GF_* at all.
  backend-preflight:
    image: alpine:3.22
    profiles: ["backend"]
    network_mode: none
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      OBS_ALERT_EMAIL: ${OBS_ALERT_EMAIL:-}
    command:
      - sh
      - -ec
      - |
        for v in GF_SECURITY_ADMIN_PASSWORD GF_SMTP_USER GF_SMTP_PASSWORD GF_SMTP_FROM_ADDRESS OBS_ALERT_EMAIL; do
          printenv "$$v" | grep -q . || { echo "backend-preflight: $$v must be set in /opt/obs/.env" >&2; exit 1; }
        done

  grafana:
    image: grafana/grafana:13.0.7
    container_name: obs-grafana
    profiles: ["backend"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # Required, but guarded by backend-preflight above rather than by `:?` — see there.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Alert delivery. Reuses the Brevo sender the apps already use — an unauthenticated sender is
      # silently DROPPED by Brevo, so this must stay a verified address (runbook, Brevo gotcha).
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-true}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-smtp-relay.brevo.com:587}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Grafana (Hetzner fleet)}
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
      # Read by the provisioned contact point.
      OBS_ALERT_EMAIL: ${OBS_ALERT_EMAIL:-}
    ports:
      # LOOPBACK ONLY. Reach it over an ssh tunnel; see the header.
      - "127.0.0.1:${OBS_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - obs
    depends_on:
      backend-preflight:
        condition: service_completed_successfully
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# The network belongs to the LotroKoniecDev stack (compose.hetzner.yaml declares it as
# `${COMPOSE_PROJECT_NAME}_obs`, next to `tks`) and this project joins it — the reverse of the first
# cut, which owned `obs_obs` outright. Caddy has to sit on this network to proxy the other box's
# pushes to loki/prometheus/tempo (ADR-0050 §4), and a CD artifact cannot join a hand-deployed
# project's network without an ordering hazard on every fresh box, while a hand-deployed project
# joining the CD stack's network has none: that stack always exists first (ADR-0050 §2, #755).
networks:
  obs:
    external: true
    name: ${OBS_NETWORK:?OBS_NETWORK must be set (lotro-staging_obs | lotro-prod_obs)}

volumes:
  alloy-data:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:
