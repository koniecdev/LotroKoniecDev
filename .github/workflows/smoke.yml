name: Smoke test

# Post-deploy smoke test (M6-13). Two entry points:
#   * workflow_call    — kept for future callers; the CD rollout does NOT call it — deploy.yml runs
#                        scripts/smoke.sh INLINE so the smoke shares the rollout job's approved
#                        environment (and can therefore roll the box back on a red result — see
#                        cd.yml's "one job per environment" note).
#   * workflow_dispatch — manual on-demand run against any environment (enter the three URLs).
#
# It gives a green/red signal that auth-api + tms-api + frontend came up correctly: health, an OIDC
# token round-trip, that tms accepts the token, and the public translation-file distribution.
#
# Prerequisite: the repository secret SMOKE_CLIENT_SECRET = the auth server's OpenIddict API client
# secret (OpenIddict__ApiClientSecret — the same value auth-api runs with).
on:
  workflow_call:
    inputs:
      auth_url:
        description: 'auth-api base URL'
        required: true
        type: string
      tms_url:
        description: 'tms-api base URL'
        required: true
        type: string
      frontend_url:
        description: 'frontend base URL'
        required: true
        type: string
      client_id:
        description: 'OIDC client id (client-credentials)'
        required: false
        type: string
        default: 'lotrokoniecdev-api'
    secrets:
      SMOKE_CLIENT_SECRET:
        description: 'OpenIddict API client secret (OpenIddict__ApiClientSecret)'
        required: false
  workflow_dispatch:
    inputs:
      auth_url:
        description: 'auth-api base URL (e.g. https://auth.lotro-translator.pl)'
        required: true
      tms_url:
        description: 'tms-api base URL (e.g. https://tms.lotro-translator.pl)'
        required: true
      frontend_url:
        description: 'frontend base URL (e.g. https://lotro-translator.pl)'
        required: true
      client_id:
        description: 'OIDC client id (client-credentials)'
        required: false
        default: 'lotrokoniecdev-api'

permissions:
  contents: read

jobs:
  smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inputs/secret are passed through the environment (never interpolated into the run: script)
      # so an input value cannot inject shell, and the secret never reaches a log line. smoke.sh
      # reads each SMOKE_* variable as its fallback for the matching flag.
      - name: Run smoke test
        env:
          SMOKE_AUTH_URL: ${{ inputs.auth_url }}
          SMOKE_TMS_URL: ${{ inputs.tms_url }}
          SMOKE_FRONTEND_URL: ${{ inputs.frontend_url }}
          SMOKE_CLIENT_ID: ${{ inputs.client_id }}
          SMOKE_CLIENT_SECRET: ${{ secrets.SMOKE_CLIENT_SECRET }}
          # Same strictness as CD: this workflow only ever targets a deployed environment,
          # and only a Development stack legitimately serves no CSP (#670).
          SMOKE_REQUIRE_CSP: '1'
        run: ./scripts/smoke.sh
