name: lotrokoniecdev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lotro_translation
    ports:
      - "5432:5432"
    volumes:
      # PG18 moved PGDATA to /var/lib/postgresql/18/docker and the VOLUME to /var/lib/postgresql;
      # mount the directory itself (not .../data) so the data subdir is persisted across recreates.
      - lotrokoniecdev-postgres-data:/var/lib/postgresql
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lotro_translation"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  rabbitmq:
    # Version pinned in lockstep with the integration suite's RabbitMqBrokerFixture (same image
    # minus the management UI) — bump both together, or the suite keeps proving the dead-letter
    # topology against the old broker generation.
    image: rabbitmq:4.3.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - lotrokoniecdev-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DASHBOARD__UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TranslationDatabase: "Host=postgres;Port=5432;Database=lotro_translation;Username=postgres;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__AuthDatabase: "Host=postgres;Port=5432;Database=lotro_auth;Username=postgres;Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

# This dev stack is INFRA-ONLY (ADR-0006, amended by #190 / M6-14): postgres + migrator + mailpit +
# aspire-dashboard. The three apps — auth-api (:5003), tms-api (:5002) and the Blazor SSR frontend
# (:7017) — run on the HOST via `dotnet run` (their `https` launchSettings profiles) or the Rider
# compound `.run/TMS dev (all hosts).run.xml`, against this in-compose Postgres on localhost:5432.
# Host Kestrels use the native ASP.NET Core dev cert (`dotnet dev-certs https --trust`) — no PFX
# mount. Because the browser, the host RP and the host resource server all resolve localhost:5003 /
# :5002 identically, one OIDC Authority/Issuer serves every leg and the token `iss` matches; tms-api
# falls back from Auth:Authority to Auth:Issuer (https://localhost:5003) to reach the host auth
# Kestrel. The containerized auth-api/tms-api services were retired here because they were neither
# the fast dev loop (host Kestrels give hot reload + breakpoints + no image rebuild) nor prod-parity
# — compose.prod.yaml is the sole containerized/parity stack and exercises the very same Dockerfiles.

volumes:
  lotrokoniecdev-postgres-data:
  lotrokoniecdev-rabbitmq-data:
