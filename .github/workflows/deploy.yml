name: Deploy (reusable rollout)

# Reusable rollout over ssh to a Hetzner box (ADR-0034, ticket #490 — it replaced the Azure Container
# Apps rollout when the student subscription died). cd.yml calls this ONCE PER ENVIRONMENT —
# deploy-staging (auto) and deploy-prod (gated promotion) — so the same rollout serves both, and the
# ADR-0018 two-stage promotion survives the platform change untouched: only the transport is new.
#
# Topology (docs/deployment/hetzner-runbook.md): ONE BOX PER ENVIRONMENT — `lotro-prod` and
# `lotro-staging` — each running the same `compose.hetzner.yaml` out of /opt/lotro against its own
# `.env`. The box a job targets comes from the environment-scoped var HETZNER_HOST; there is no
# `--env-file` / `-p` juggling (the single-CX32 shape the ticket was written against; the fleet that
# was actually bought is two CX23s, so one box IS one environment).
#
# The rollout:
#   1. resolve the tag to DIGESTS and verify each image's build provenance (audit 0001 H9) — an image
#      this CD did not build, scan and attest never reaches a box.
#   2. publish the pre-migration restore point + cut the Neon snapshot branch (MIGR-01/MIGR-04) — the
#      migrator is about to run, and ADR-0023's recovery story is roll-forward or restore, never Down().
#   3. snapshot the box's live config, scp the stack files (compose + Caddyfile + deploy.sh) so the
#      box's config IS the deployed commit, then run scripts/hetzner/deploy.sh over ssh: validate →
#      pull → assert the pulled digests are the attested ones → run the migrator as a GATE → `up -d`
#      → reload Caddy → pin the tag in .env.
#   4. wait for the public origins to answer, smoke them (scripts/smoke.sh — the fingerprint leg,
#      because `GET / -> 200` proves nothing), and roll the box back — images AND config — if anything
#      above went red.
#
# What is deliberately GONE versus the ACA rollout: the 0%-traffic candidate revision, its label FQDN
# smoke and the one-active-revision sweep. A 4 GB box cannot hold a second live set of three apps, so
# `up -d` recreates containers in place — a few seconds of downtime per app, and the smoke necessarily
# runs AFTER traffic is already on the new containers. The compensating controls are the migration
# gate (deploy.sh runs the migrator as its own one-off container BEFORE any app container is
# recreated, so a bad migration leaves the previous release serving and is a no-op for the site) and
# the automatic rollback below. Pre-launch, with no users, that trade is the right one; a real
# blue/green would need a second box or a bigger one.
on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub Environment (staging | production) — selects vars/secrets and the approval gate.'
        required: true
        type: string
      deploy_sha:
        description: 'The exact commit CI tested, pinned by the gate (build == deployed).'
        required: true
        type: string
      short_sha:
        description: 'Short SHA → the sha-<short> image tag.'
        required: true
        type: string
      image_tag:
        description: 'Explicit image tag to deploy; empty = sha-<short_sha>.'
        required: false
        type: string
        default: ''

permissions:
  contents: read # checkout (scripts/, compose.hetzner.yaml, the Caddyfile)
  packages: read # pull image manifests + provenance attestations from GHCR for the verify gate (H9)

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  # Every stack file lives here on the box, owned by the deploy user (runbook → "Filesystem layout").
  STACK_DIR: /opt/lotro

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }} (Hetzner)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment carries the protection rules: `production` has the required-reviewer gate (this is
    # the staging→prod promotion approval); `staging` has none (auto). It also selects the env-scoped
    # vars/secrets — crucially HETZNER_HOST, which is what makes this job target one box or the other.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.FRONTEND_URL }}
    # Per-environment rollout lock: never cancel a roll in progress (a half-rolled box is worse than a
    # queued deploy) — queue instead.
    concurrency:
      group: ${{ inputs.environment == 'production' && 'prod-mutation' || 'staging-mutation' }}
      cancel-in-progress: false
    # Never interpolate ${{ }} into a run: body — every value a step reads arrives through the
    # environment (repo convention; it is also what keeps a free-text dispatch input out of shell).
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER || 'deploy' }}
      HETZNER_SSH_KNOWN_HOSTS: ${{ vars.HETZNER_SSH_KNOWN_HOSTS }}
      AUTH_URL: ${{ vars.AUTH_URL }}
      TMS_URL: ${{ vars.TMS_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}

    steps:
      # Check out the EXACT commit the gate pinned (the commit CI tested), so the stack files and the
      # deploy script this job ships to the box match the images being rolled — not main's tip.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.deploy_sha }}
          # No later step does authenticated git — don't leave the workflow token in .git/config.
          persist-credentials: false

      # Fail closed and EARLY on an unconfigured environment. Every one of these is set once, by hand,
      # per environment (runbook → "Continuous deployment (CD over ssh)"). A missing host key var in
      # particular must never degrade into StrictHostKeyChecking=no: that would hand the deploy key and
      # the whole box to whoever answers on that IP.
      - name: Check the environment is wired for ssh deploys
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HETZNER_HOST:-}" ] || missing="${missing} vars.HETZNER_HOST"
          [ -n "${HETZNER_SSH_KNOWN_HOSTS:-}" ] || missing="${missing} vars.HETZNER_SSH_KNOWN_HOSTS"
          [ -n "${SSH_KEY:-}" ] || missing="${missing} secrets.HETZNER_SSH_KEY"
          [ -n "${AUTH_URL:-}" ] || missing="${missing} vars.AUTH_URL"
          [ -n "${TMS_URL:-}" ] || missing="${missing} vars.TMS_URL"
          [ -n "${FRONTEND_URL:-}" ] || missing="${missing} vars.FRONTEND_URL"
          if [ -n "$missing" ]; then
            echo "::error::Environment '${ENVIRONMENT}' is not wired for ssh deploys — missing:${missing}"
            echo "See docs/deployment/hetzner-runbook.md → 'Continuous deployment (CD over ssh)'."
            exit 1
          fi
          echo "Target: ${HETZNER_USER}@${HETZNER_HOST}:${STACK_DIR}"

      # The gate's short_sha is trusted (hex). The dispatch image_tag input is NOT — it is free text a
      # human typed, and it ends up inside a remote shell command below, so constrain it to what a GHCR
      # tag may actually contain before it can go anywhere near ssh.
      - name: Resolve image tag
        id: tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          GATE_SHORT_SHA: ${{ inputs.short_sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_TAG:-}" ]; then
            tag="$INPUT_IMAGE_TAG"
          else
            tag="sha-${GATE_SHORT_SHA}"
          fi
          case "$tag" in
            *[!A-Za-z0-9._-]* | '')
              echo "::error::Refusing image tag '${tag}' — a GHCR tag is [A-Za-z0-9._-] only."
              exit 1
              ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'Deploying image tag: %s\n' "$tag"

      # GHCR tags are MUTABLE; digests are not. Resolve the requested tag to its digest ONCE, verify the
      # provenance of THAT digest, and hand the digests to the box so deploy.sh can assert the bytes it
      # pulled are the very ones verified here. A tag moved mid-rollout is then inert end to end.
      - name: Log in to GHCR (read-only — digest resolution)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin images to digests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          digests=""
          for image in \
            lotrokoniecdev-migrator \
            lotrokoniecdev-auth-api \
            lotrokoniecdev-tms-api \
            lotrokoniecdev-frontend; do
            repo="${REGISTRY}/${IMAGE_NAMESPACE}/${image}"
            ref="${repo}:${TAG}"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::Could not resolve a digest for ${ref} (got '${digest:-<empty>}')"; exit 1 ;;
            esac
            digests="${digests}${digests:+ }${repo}@${digest}"
            printf '%s -> %s\n' "$ref" "$digest"
          done
          printf 'EXPECTED_DIGESTS=%s\n' "$digests" >> "$GITHUB_ENV"

      # Supply-chain gate BEFORE anything touches the box (audit 0001 H9). Every image about to run must
      # carry a build-provenance attestation signed by THIS repo's CD. A foreign, tampered or
      # never-built-by-us image fails closed here — before the migrator runs.
      - name: Verify image provenance (fail closed before rollout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for ref in $EXPECTED_DIGESTS; do
            echo "::group::Verify provenance — ${ref}"
            gh attestation verify "oci://${ref}" --repo "$GITHUB_REPOSITORY"
            echo "::endgroup::"
          done

      # MIGR-01 (#336) + MIGR-04 (#339): the migrator runs inside the `up -d` below, so publish the
      # restore point and cut the durable Neon snapshot branch FIRST. ADR-0023 recovery is roll-forward
      # or restore — never Down() — and Neon Free keeps only 6 h of PITR, so a branch (whose head never
      # expires) is what makes a late-noticed bad migration recoverable. This is a safety NET, not a
      # gate: an unconfigured environment skips it cleanly and no Neon API hiccup may fail the deploy.
      - name: Publish the pre-migration restore point (Neon snapshot)
        env:
          SHORT_SHA: ${{ inputs.short_sha }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          latest_migration() {
            find "$1" -mindepth 1 -maxdepth 1 -printf '%f\n' | grep -E '^[0-9]{14}_' | grep -v '\.Designer\.cs$' | sed 's/\.cs$//' | sort | tail -1
          }
          tms_target=$(latest_migration src/TranslationSystem/LotroKoniecDev.TranslationSystem.Persistence/Migrations || true)
          auth_target=$(latest_migration src/AuthSystem/LotroKoniecDev.AuthSystem.Persistence/Migrations || true)
          # Retention: max ONE snapshot branch per project (both Free-plan projects sit near the storage
          # cap, and the previous deploy's snapshot guards a migration that already proved good), so the
          # old migr04-pre-* branches go BEFORE the new one is cut.
          neon_api="https://console.neon.tech/api/v2"
          snapshot_row="skipped (not configured)"
          if [ -n "${NEON_API_KEY:-}" ] && [ -n "${NEON_PROJECT_ID:-}" ]; then
            snapshot_name="migr04-pre-${SHORT_SHA}-$(date -u +%Y%m%dT%H%M%SZ)"
            if branches_json=$(curl -fsS --max-time 30 -H "Authorization: Bearer $NEON_API_KEY" \
                  "${neon_api}/projects/${NEON_PROJECT_ID}/branches"); then
              printf '%s' "$branches_json" \
                | jq -r '.branches[] | select(.name | startswith("migr04-pre-")) | .id' \
                | while IFS= read -r old_id; do
                    [ -n "$old_id" ] || continue
                    echo "Neon: deleting previous snapshot branch ${old_id} (retention: max 1 per project)"
                    curl -fsS --max-time 30 -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
                      "${neon_api}/projects/${NEON_PROJECT_ID}/branches/${old_id}" -o /dev/null \
                      || echo "::warning::Neon: could not delete old snapshot branch ${old_id} (non-blocking)"
                  done \
                || echo "::warning::Neon: retention sweep did not complete (non-blocking)"
            else
              echo "::warning::Neon: could not list branches for the retention sweep (non-blocking)"
            fi
            if create_json=$(curl -fsS --max-time 30 -X POST \
                  -H "Authorization: Bearer $NEON_API_KEY" -H "Content-Type: application/json" \
                  -d "{\"branch\": {\"name\": \"${snapshot_name}\"}}" \
                  "${neon_api}/projects/${NEON_PROJECT_ID}/branches"); then
              snapshot_id=$(printf '%s' "$create_json" | jq -r '.branch.id' 2>/dev/null || echo unknown)
              snapshot_row="\`${snapshot_name}\` (\`${snapshot_id}\`)"
              echo "Neon: created pre-migration snapshot branch ${snapshot_name} (${snapshot_id})"
            else
              snapshot_row="creation failed (non-blocking — see the deploy log)"
              echo "::warning::Neon: snapshot branch creation failed (non-blocking — the ambient 6 h PITR window still applies)"
            fi
          else
            echo "Neon snapshot skipped (not configured)"
          fi
          restore_point=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "### DB restore point (pre-migration)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Restore point (UTC, captured before the migrator runs) | \`${restore_point}\` |"
            echo "| Neon snapshot branch (durable restore source) | ${snapshot_row} |"
            echo "| Target migration — translation | \`${tms_target:-unknown}\` |"
            echo "| Target migration — auth | \`${auth_target:-unknown}\` |"
            echo ""
            echo "Bad migration? Runbook → \"Restore from the auto-snapshot\" (works past the 6 h window when the snapshot row above is a branch) or \"Recover from a bad migration (Neon PITR)\" (restore to the timestamp above, 6 h retention)."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true

      # Host-key pinning is the whole security of this transport: the key comes from the env var, and an
      # unknown host key aborts the connection (StrictHostKeyChecking=yes) rather than trusting on first
      # use. The ssh config keeps every later step down to `ssh box` / `scp … box:` with no flag soup.
      - name: Configure ssh to the box
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$HETZNER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          {
            echo "Host box"
            echo "  HostName ${HETZNER_HOST}"
            echo "  User ${HETZNER_USER}"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh box 'echo "ssh OK as $(id -un) on $(hostname)"; docker compose version'

      # The box's config must BE the deployed commit — otherwise a Caddyfile or compose change would
      # land in git and never reach the server (the failure mode the runbook's "scp again" recovery
      # step exists for). The box `.env` is NEVER touched from here: it holds the environment's secrets
      # and lives only on the box (HETZ-03).
      - name: Sync the stack files to the box
        run: |
          set -euo pipefail
          # Snapshot the config that is LIVE right now, before overwriting it. The deploy unit is
          # images + compose file + Caddyfile, so the rollback unit must be too: rolling only the
          # image tag back would leave this commit's (possibly broken) Caddyfile on the box, armed to
          # take the proxy down at the next reload or reboot. The rollback step restores from here.
          # SC2029 (every ssh line here): the RUNNER must expand ${STACK_DIR} into the remote command
          # — the box has no such variable. Intentional.
          # shellcheck disable=SC2029
          ssh box "
            set -e
            mkdir -p ${STACK_DIR}/.docker/hetzner ${STACK_DIR}/.previous/.docker/hetzner
            cd ${STACK_DIR}
            for f in compose.hetzner.yaml .docker/hetzner/Caddyfile deploy.sh; do
              [ -f \"\$f\" ] && cp -p \"\$f\" \".previous/\$f\" || true
            done
          "
          scp compose.hetzner.yaml "box:${STACK_DIR}/compose.hetzner.yaml"
          scp .docker/hetzner/Caddyfile "box:${STACK_DIR}/.docker/hetzner/Caddyfile"
          scp scripts/hetzner/deploy.sh "box:${STACK_DIR}/deploy.sh"
          # shellcheck disable=SC2029
          ssh box "chmod 755 ${STACK_DIR}/deploy.sh"

      # The rollout itself (scripts/hetzner/deploy.sh, on the box): pin the tag in .env → pull → assert
      # the pulled digests are the attested ones → `up -d`, where the one-shot migrator gates the apps →
      # reload Caddy. PREVIOUS_IMAGE_TAG is printed by the script BEFORE it changes anything, so the
      # rollback step below has its target even when the roll dies half-way.
      - name: Deploy (pull → migrate → up)
        id: rollout
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          rc=0
          # SC2029: the RUNNER must expand the tag/digests/stack dir into the remote command — that is
          # the point (the box knows none of them). Both values are validated above: TAG is
          # [A-Za-z0-9._-] only and EXPECTED_DIGESTS is built here from resolved sha256 digests.
          # shellcheck disable=SC2029
          ssh box "IMAGE_TAG='${TAG}' EXPECTED_DIGESTS='${EXPECTED_DIGESTS}' bash ${STACK_DIR}/deploy.sh" \
            2>&1 | tee deploy-output.log || rc=$?
          # The previous tag is read off the box's .env, so treat it as data, not as trusted input: it
          # goes back into a remote command in the rollback step. Anything that is not a legal image tag
          # is dropped (no PREVIOUS_IMAGE_TAG ⇒ no automatic rollback, and the job still fails loudly).
          previous="$(sed -n 's/^PREVIOUS_IMAGE_TAG=//p' deploy-output.log | head -1 | tr -d '\r')"
          case "$previous" in
            '' | *[!A-Za-z0-9._-]*)
              [ -z "$previous" ] || echo "::warning::Ignoring an unusable previous image tag from the box .env — automatic rollback is disabled for this run."
              ;;
            *) printf 'PREVIOUS_IMAGE_TAG=%s\n' "$previous" >> "$GITHUB_ENV" ;;
          esac
          exit "$rc"

      # Readiness BEFORE smoke — the ACA rollout had this and dropping it would make green deploys
      # flap. `up -d` returns as soon as auth/tms report healthy and the frontend/Caddy are merely
      # *started*: the Static-SSR frontend is a cold .NET app at that moment, and `scripts/smoke.sh`
      # fires single-shot curls (its --timeout is per-request; it has no retry loop). Without this
      # budget the very first request could time out on a perfectly good release — and the rollback
      # step below would then dutifully roll it back. Polls the PUBLIC origins, so it also exercises
      # Caddy's routing and its certificate.
      - name: Wait for the environment to come up
        run: |
          set -euo pipefail
          poll() {
            name="$1"; url="$2"; lo="$3"; hi="$4"
            echo "::group::Waiting for ${name}: ${url}"
            for _ in $(seq 1 60); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)
              echo "  ${name} → ${code}"
              if [ "$code" -ge "$lo" ] 2>/dev/null && [ "$code" -le "$hi" ] 2>/dev/null; then
                echo "::endgroup::"; return 0
              fi
              sleep 5
            done
            echo "::endgroup::"
            echo "::error::${name} did not become ready: ${url}"
            return 1
          }
          poll auth     "${AUTH_URL}/health/ready" 200 200
          poll tms      "${TMS_URL}/health/ready" 200 200
          # The Static-SSR frontend has no deep health endpoint — "the page serves" is its liveness.
          poll frontend "${FRONTEND_URL}/" 200 399

      # The real gate on this platform. There is no 0%-traffic candidate to smoke first, so this runs
      # against the LIVE public origins right after the containers were replaced — and a red result
      # rolls the box back. `GET / -> 200` proves nothing (house rule): smoke's fingerprint leg is what
      # actually catches a frontend image whose static assets did not ship (#414).
      # The client secret rides ONLY in the env (smoke.sh reads SMOKE_CLIENT_SECRET natively) — as an
      # argv it would be visible to every process on the runner for the script's lifetime.
      - name: Smoke the deployed environment
        env:
          SMOKE_CLIENT_SECRET: ${{ secrets.SMOKE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          ./scripts/smoke.sh \
            --auth-url "$AUTH_URL" \
            --tms-url "$TMS_URL" \
            --frontend-url "$FRONTEND_URL" \
            --timeout 30

      # Auto-rollback — restore the WHOLE previous deploy unit, not just its images: the config this
      # job scp'd is put back from the .previous/ snapshot first (a broken Caddyfile in this commit
      # would otherwise survive the rollback and re-break the re-run), then the previous deploy.sh is
      # re-run with the previous tag.
      #
      # Note it does NOT re-pass EXPECTED_DIGESTS: those digests belong to the image tag that just
      # failed. The tag we roll BACK to was itself provenance-verified when it was deployed, and the
      # box very likely still has its layers — the residual risk (someone re-points an OLD sha- tag in
      # GHCR between then and now) needs registry write access, at which point the rollback is not the
      # weakest link.
      #
      # Reached only when deploy.sh had already started (it prints PREVIOUS_IMAGE_TAG before touching
      # anything); an earlier gate failing means the box was never touched, so there is nothing to
      # undo. Note that deploy.sh now aborts a bad migration BEFORE recreating any app container, so
      # the common "migration failed" case never gets here — the site simply never went down.
      # The job still fails; this only restores service.
      - name: Roll back to the previous tag on failure
        if: failure() && env.PREVIOUS_IMAGE_TAG != ''
        run: |
          set -euo pipefail
          echo "::error::Rollout or smoke failed — rolling ${HETZNER_HOST} back to ${PREVIOUS_IMAGE_TAG}."
          # SC2029: the RUNNER must expand the tag + stack dir into the remote command (the tag was
          # validated at capture time in the deploy step above). Intentional.
          # shellcheck disable=SC2029
          ssh box "
            set -e
            cd ${STACK_DIR}
            for f in compose.hetzner.yaml .docker/hetzner/Caddyfile deploy.sh; do
              [ -f \".previous/\$f\" ] && cp -p \".previous/\$f\" \"\$f\" || true
            done
            IMAGE_TAG='${PREVIOUS_IMAGE_TAG}' bash ${STACK_DIR}/deploy.sh
          "
          {
            echo "### ⏮️ Rolled back"
            echo ""
            echo "\`${ENVIRONMENT}\` was rolled back to image tag \`${PREVIOUS_IMAGE_TAG}\` after a failed rollout/smoke."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true

      - name: Summarize the rollout
        if: success()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### ✅ Deployed to ${ENVIRONMENT}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Box | \`${HETZNER_USER}@${HETZNER_HOST}\` |"
            echo "| Image tag | \`${TAG}\` |"
            echo "| Commit | \`${DEPLOY_SHA}\` |"
            echo "| Frontend | ${FRONTEND_URL} |"
            echo ""
            echo "Smoke green on the public origins (health, FE fingerprint, OIDC token, token accepted, distribution)."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
