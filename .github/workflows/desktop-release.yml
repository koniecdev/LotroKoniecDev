name: Desktop release

# The desktop app's installer and its GitHub Release (spec 0016; ADR-0070, 2026-11-16 amendment).
#
# - "Run workflow" on main with a version X.Y.Z: check the version, build the exe and the Inno Setup
#   installer on Windows, install it, install it again over the running app, uninstall it. Only then
#   does the release job create the tag desktop-vX.Y.Z on this commit and publish the release with the
#   installer and its .sha256. A run that fails before that leaves no tag and no release.
# - A pull request that touches what goes into the installer runs the same build and smoke test with
#   version 0.0.0 and publishes nothing. This workflow cannot run from a branch before it is on main,
#   so the PR leg is its only proof before a merge, and the first CI run that starts the desktop app.
#
# No workflow starts on a tag or a release (scripts/tests/commit-image.tests.sh checks it), and a
# release made with GITHUB_TOKEN starts no other run. Not a required check, so the path filter is
# allowed. Every input reaches a script through env:, never through ${{ }} inside run:.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z, without the desktop-v prefix (for example 0.1.0)'
        required: true
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - 'src/Player/**'
      - 'src/Patcher/**'
      - 'src/Utilities/LotroKoniecDev.Hateoas.Abstractions/**'
      - 'installer/**'
      - '.github/workflows/desktop-release.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
      - 'NOTICE'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'

# A new push to a PR cancels its older run. A running release is never cancelled; GitHub keeps one
# waiting run per group, so a third dispatch replaces the one that waits.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'desktop-release-dispatch' || format('desktop-release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test the installer
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version before any build
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/desktop-release-check.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The newest 10.0.1xx SDK, so the self-contained exe carries the newest .NET 10 runtime patch.
          dotnet-version: '10.0.1xx'

      - name: Build with a .NET 10 SDK
        run: |
          # The image also ships a newer SDK, and with no global.json the newest one builds. The repo
          # stays on .NET 10 (owner decision on #1444), so this job picks the newest 10.0.1xx itself.
          # #1447 commits a global.json and removes this step; a committed one is never overwritten.
          if (Test-Path global.json) {
            Write-Host "A committed global.json picks the SDK."
          } else {
            Set-Content -Path global.json -Encoding utf8NoBOM `
              -Value '{ "sdk": { "version": "10.0.100", "rollForward": "latestPatch" } }'
          }
          $sdk = dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "dotnet --version failed with $LASTEXITCODE." }
          Write-Host "SDK $sdk"
          if (-not $sdk.StartsWith('10.')) { throw "Expected a .NET 10 SDK, found $sdk." }

      - name: Pick the version
        env:
          VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $appVersion = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:VERSION } else { '0.0.0' }
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_NAME=LotroPoPolsku-Setup-$appVersion.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish the exe
        run: |
          dotnet publish src/Player/LotroKoniecDev.DesktopApp/LotroKoniecDev.DesktopApp.csproj `
            -c Release `
            -o "$env:RUNNER_TEMP\publish" `
            "-p:Version=$env:APP_VERSION" `
            -p:DebugType=embedded
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }
          Get-ChildItem "$env:RUNNER_TEMP\publish" | Format-Table Name, Length

      - name: Build the installer
        run: |
          # The image's Inno Setup, by its real path: the ISCC on PATH is a Chocolatey shim. Each major
          # installs into its own folder, so a missing 'Inno Setup 6' folder stops the build before a
          # new major changes the compiler under us. ISCC.exe carries no version number of its own
          # (it reads 0.0.0.0), so the version is only printed, from the compiler DLL, for the log.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not at $iscc." }
          $compiler = Join-Path (Split-Path $iscc) 'ISCmplr.dll'
          if (Test-Path $compiler) { Write-Host "Inno Setup compiler $((Get-Item $compiler).VersionInfo.FileVersion)" }

          & $iscc /Qp `
            "/DAppVersion=$env:APP_VERSION" `
            "/DPublishDir=$env:RUNNER_TEMP\publish" `
            "/DRepoRoot=$env:GITHUB_WORKSPACE" `
            "/O$env:RUNNER_TEMP\installer" `
            installer\LotroPoPolsku.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE." }

      - name: Install, install again over the running app, uninstall (refused while it runs, then for real)
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "installer\$env:INSTALLER_NAME"
          $logs = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          $appDir = Join-Path ${env:ProgramFiles(x86)} 'LotroPoPolsku'
          $appExe = Join-Path $appDir 'LotroPoPolsku.exe'
          $desktopLink = Join-Path $env:PUBLIC 'Desktop\LOTRO po Polsku.lnk'
          $startMenuLink = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\LOTRO po Polsku.lnk'
          $uninstallKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{53881929-2972-43D8-ACE2-1AED0D822D9F}_is1'
          $dataDir = Join-Path $env:APPDATA 'LotroPoPolsku'
          $marker = Join-Path $dataDir 'smoke-marker.txt'

          # Start-Process -Wait would also wait for the app the installer starts. Reading Handle right
          # away keeps the exit code readable after the process ends.
          function Invoke-AndWait([string] $file, [string[]] $arguments) {
            $process = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit(300000)) { throw "$file did not finish within 5 minutes." }
            return $process.ExitCode
          }
          function Wait-Until([scriptblock] $condition, [int] $seconds, [string] $what) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while (-not (& $condition)) {
              if ((Get-Date) -gt $deadline) { throw "Waited $seconds s for $what." }
              Start-Sleep -Milliseconds 500
            }
          }
          function Get-App { @(Get-Process -Name 'LotroPoPolsku' -ErrorAction SilentlyContinue) }
          # The same flags the app passes on "Tak" (DesktopReleasePolicy.InstallerArguments).
          function Install([string] $logName) {
            $arguments = @('/SILENT', '/NOCANCEL', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', '/FORCECLOSEAPPLICATIONS', "`"/LOG=$(Join-Path $logs $logName)`"")
            $exitCode = Invoke-AndWait $installer $arguments
            if ($exitCode -ne 0) { throw "The installer exited with $exitCode ($logName)." }
          }

          Install 'install-1.log'
          foreach ($file in @($appExe, (Join-Path $appDir 'NOTICE'), (Join-Path $appDir 'LICENSE'), (Join-Path $appDir 'THIRD-PARTY-NOTICES.md'), $desktopLink, $startMenuLink, $uninstallKey)) {
            if (-not (Test-Path $file)) { throw "Install 1 did not create $file." }
          }
          $pdbs = @(Get-ChildItem -Path $appDir -Recurse -Filter '*.pdb')
          if ($pdbs.Count -gt 0) { throw "Install 1 shipped symbol files: $($pdbs.Name -join ', ')." }
          # The app reads the same $(Version) as its DesktopVersion stamp; a release must carry its number.
          $fileVersion = (Get-Item $appExe).VersionInfo.FileVersion
          if ($fileVersion -ne "$env:APP_VERSION.0") { throw "The installed exe is version $fileVersion, not $env:APP_VERSION." }

          # The app starts its composition root with ValidateOnBuild, so a broken DI graph ends it.
          Wait-Until { (Get-App).Count -gt 0 } 60 'the app to start after install 1'
          Start-Sleep -Seconds 10
          $first = Get-App
          if ($first.Count -eq 0) { throw 'The app ended within 10 s of its start; see its log in the artifact.' }
          $firstIds = $first.Id

          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Set-Content -Path $marker -Value 'uninstall must keep this'

          Install 'install-2.log'
          Wait-Until { @(Get-Process -Id $firstIds -ErrorAction SilentlyContinue).Count -eq 0 } 60 'install 2 to close the running app'
          Wait-Until { @(Get-App | Where-Object { $firstIds -notcontains $_.Id }).Count -gt 0 } 60 'the app to start after install 2'
          # The app creates the mutex the uninstaller checks in Main, a moment after its process appears.
          Start-Sleep -Seconds 10
          if (@(Get-App).Count -eq 0) { throw 'The app ended within 10 s of its start after install 2.' }

          # The uninstaller cannot remove a running exe, so a silent one must refuse and leave all in place.
          $uninstaller = (Get-ItemProperty -Path $uninstallKey).UninstallString.Trim('"')
          $refusedExitCode = Invoke-AndWait $uninstaller @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "`"/LOG=$(Join-Path $logs 'uninstall-refused.log')`"")
          Write-Host "The uninstaller started while the app ran exited with $refusedExitCode."
          Start-Sleep -Seconds 20
          foreach ($file in @($appExe, $desktopLink, $startMenuLink, $uninstallKey)) {
            if (-not (Test-Path $file)) { throw "An uninstall while the app ran removed $file." }
          }

          Get-App | Stop-Process -Force
          Wait-Until { (Get-App).Count -eq 0 } 60 'the app to end before the uninstall'
          $exitCode = Invoke-AndWait $uninstaller @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "`"/LOG=$(Join-Path $logs 'uninstall.log')`"")
          if ($exitCode -ne 0) { throw "The uninstaller exited with $exitCode." }
          # The uninstaller hands over to a copy of itself and finishes after this process ends.
          Wait-Until { -not ((Test-Path $appDir) -or (Test-Path $desktopLink) -or (Test-Path $startMenuLink) -or (Test-Path $uninstallKey)) } 120 'the uninstall to remove the install folder, both shortcuts and the uninstall entry'
          if (-not (Test-Path $marker)) { throw "The uninstall removed the app's data folder." }
          Write-Host 'Install, re-install over the running app, the refused uninstall and the uninstall all passed.'

      - name: Write the SHA-256 file
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "installer\$env:INSTALLER_NAME"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          # sha256sum format, ASCII, LF, no byte order mark (spec 0016).
          [System.IO.File]::WriteAllText("$installer.sha256", "$hash  $env:INSTALLER_NAME`n", [System.Text.Encoding]::ASCII)
          Get-Content "$installer.sha256"

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-installer
          path: |
            ${{ runner.temp }}/installer/LotroPoPolsku-Setup-*.exe
            ${{ runner.temp }}/installer/LotroPoPolsku-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Collect the logs of a failed run
        if: failure()
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $appLog = Join-Path $env:APPDATA 'LotroPoPolsku\LotroPoPolsku.log'
          if (Test-Path $appLog) { Copy-Item $appLog $logs }

      - name: Upload the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke-logs
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Tag and publish the release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Again here, so a "Re-run jobs" of this job alone cannot publish a version that another run
      # released since the build job checked it.
      - name: Check the version again before the tag
        run: ./scripts/ci/desktop-release-check.sh

      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-installer
          path: installer

      - name: Check the files against the SHA-256 written on the Windows runner
        working-directory: installer
        run: sha256sum -c "LotroPoPolsku-Setup-$VERSION.exe.sha256"

      - name: Create the tag on this commit
        run: |
          set -euo pipefail
          # The refs API refuses a ref that exists, so two runs cannot both publish. gh release create
          # --target would instead attach the release to an existing tag's commit.
          gh api -X POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/desktop-v$VERSION" -f "sha=$GITHUB_SHA" > /dev/null
          echo "TAG_CREATED=true" >> "$GITHUB_ENV"

      - name: Publish the release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/notes.md"
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$notes_file"
          else
            printf 'Wydanie aplikacji LOTRO po Polsku %s.\n' "$VERSION" > "$notes_file"
          fi
          # Never Latest: GitHub's "Latest" stays on the server's releases (ADR-0070 amendment).
          gh release create "desktop-v$VERSION" \
            --verify-tag \
            --latest=false \
            --title "desktop-v$VERSION" \
            --notes-file "$notes_file" \
            "installer/LotroPoPolsku-Setup-$VERSION.exe" \
            "installer/LotroPoPolsku-Setup-$VERSION.exe.sha256"

      # Also on a cancel or the job's time limit, so a stopped run never leaves a tag with no release.
      - name: Remove the tag of a failed release
        if: (failure() || cancelled()) && env.TAG_CREATED == 'true'
        run: ./scripts/ci/desktop-release-cleanup.sh
