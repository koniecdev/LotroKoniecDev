name: Pull Request Verification

# Full gate on every PR push, BEFORE merge: Release build (the repo-wide zero-warning gate)
# + unit tests + integration tests (real PostgreSQL via Testcontainers). In this repo the
# author merges their own PRs (loop workflow), so the PR — not a post-merge job — is where
# main is kept green. The CI workflow re-runs the same suite on main as a backstop.
#
# Non-.NET-only PRs (and the former docs-only deadlock): the main ruleset REQUIRES the "Pull
# Request Verification" check, but a workflow filtered out by `on.paths-ignore` never reports it —
# so such a PR could never merge (the old workaround was smuggling a build-relevant file into the
# PR). The workflow therefore ALWAYS triggers and the heavy job self-skips via the `changes` gate
# below when nothing in the PR can affect the .NET build/tests/SSR guard: a job skipped by `if:`
# reports success to required status checks — GitHub's documented pattern for combining required
# checks with path filtering. CI (main) keeps its own paths-ignore on purpose: a docs-only push
# must keep triggering no CI and therefore no CD (audit 0001 M2).
#
# Container images (CI-01 / #403): Dockerfiles stay `inert` for the .NET job — that classification
# is literally right, a Dockerfile change cannot break `dotnet build`, the test suites or the SSR
# guard (they sit in `force_build` only so the restore-graph guard re-checks their COPY lists).
# But the shipped images used to be built for the first time in cd.yml, AFTER the merge — so a
# Dependabot base-image digest bump could land on main without the image ever having been built or
# scanned, and a fixable HIGH/CRITICAL in the new base surfaced only once main was already
# un-deployable. The `changes` job therefore emits a second output, `images`, and the `images` job
# below builds all four shipped images with `push: false` and Trivy-scans them ON the PR. cd.yml
# keeps its own post-push scan of the exact published digest before cosign signs it; the PR scan is
# an earlier, additional gate, not a replacement.
on:
  pull_request:
    branches: ["main"]

# A new push to the same PR cancels the in-progress run instead of paying for both.
concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      images: ${{ steps.diff.outputs.images }}
    steps:
      # fetch-depth: 2 brings the PR merge commit plus both parents, so HEAD^1 (the base tip)
      # is diffable without full history.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      # A PR that changes ONLY files which cannot affect the .NET build, the unit/integration tests
      # or the SSR-purity guard skips the heavy job below. No untrusted input reaches this script
      # (pure git against the checked-out merge commit). Fails OPEN (code=true) if the diff cannot be
      # computed — a redundant build beats a false green.
      - name: Classify changed paths
        id: diff
        run: |
          set -euo pipefail
          # Inert paths: docs, shell/PowerShell scripts, IaC (infra.yml gates it separately),
          # Docker (only the flavors we actually ship — a NEW flavor safely triggers a redundant
          # build until it is listed here, never a false skip) / compose, the .docker/ trust
          # material, editor/run configs, .env examples, and everything under .github/ (workflows,
          # issue/PR templates). A PR touching only these cannot break the .NET build, the tests, or
          # the SSR guard. Workflow files are not unchecked, though: actionlint.yml (CI-02 / #404)
          # parses .github/workflows/** on every PR. NEVER add a build input here (.editorconfig, Directory.*.props/.targets,
          # global.json, nuget.config, test fixtures) — that would be a false green.
          inert='\.md$|^docs/|^LICENSE$|^\.gitignore$|^\.gitattributes$|\.sh$|\.ps1$|^iac/|(^|/)Dockerfile(\.migrator(\.prod)?|\.tests)?$|^compose[^/]*\.ya?ml$|^\.docker/|^\.github/|^\.run/|^\.vscode/|^\.idea/|(^|/)\.env[^/]*\.example$'
          # Build-relevant despite matching `inert`: check-ssr-purity.sh, the migration-safety
          # guard + its self-test, the Docker restore-graph guard, and the backlog loop's
          # provenance gate + its self-test are EXECUTED by the build job (the .ps1 twins run
          # through the migration self-test's pwsh leg), and pr-verify/ci define the .NET gate
          # itself — a change to any of them must run the gate so it validates its own new
          # definition. Dockerfiles join them because the restore-graph guard now reads them: a
          # Dockerfile-only PR that drops a COPY ["…csproj"] line must still face the gate that
          # catches it.
          force_build='^scripts/check-ssr-purity\.sh$|^scripts/check-migration-safety\.(sh|ps1)$|^scripts/tests/check-migration-safety\.tests\.sh$|^scripts/check-dockerfile-restore-graph\.(sh|ps1)$|^scripts/claude/(issue-trust|next-ticket|work-ticket)\.sh$|^scripts/tests/claude-loop-provenance\.tests\.sh$|(^|/)Dockerfile(\.migrator(\.prod)?|\.tests)?$|^\.github/workflows/pr-verify\.yml$|^\.github/workflows/ci\.yml$'
          # Image-build inputs (CI-01 / #403): ANY Dockerfile flavor (a dev-only flavor costs a
          # redundant image build, never a false skip), the build-context filter (.dockerignore),
          # and this workflow itself — a change to the image job's definition must build the images
          # so it validates itself. Fails open like `code` (images=true) if the diff is missing.
          image_inputs='(^|/)Dockerfile[^/]*$|(^|/)\.dockerignore$|^\.github/workflows/pr-verify\.yml$'
          code=true
          images=true
          if files="$(git diff --name-only HEAD^1 HEAD)"; then
            build_relevant="$(printf '%s\n' "$files" | grep -vE "$inert" || true)"
            forced="$(printf '%s\n' "$files" | grep -E "$force_build" || true)"
            image_relevant="$(printf '%s\n' "$files" | grep -E "$image_inputs" || true)"
            if [ -n "$files" ] && [ -z "$build_relevant" ] && [ -z "$forced" ]; then
              code=false
            fi
            if [ -n "$files" ] && [ -z "$image_relevant" ]; then
              images=false
            fi
            echo "Changed files:"
            printf '%s\n' "$files" | sed 's/^/  /'
            echo "Build-relevant files: ${build_relevant:-<none>}"
            echo "Forced-build files:   ${forced:-<none>}"
            echo "Image-relevant files: ${image_relevant:-<none>}"
          else
            echo "::warning::Could not compute the PR diff — running the full gate."
          fi
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

  build:
    name: Pull Request Verification
    needs: changes
    # Inert-only PR ⇒ skipped, and a skipped job satisfies the required "Pull Request Verification"
    # status check (see the header comment).
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # fetch-depth: 2 brings the PR merge commit plus both parents, so the migration-safety
          # guard can diff newly-added files against HEAD^1 (the base tip).
          fetch-depth: 2
          persist-credentials: false

      # Fast, dependency-free gate: the Frontend must stay Static SSR. Runs before
      # the .NET setup so a stray @rendermode/@onclick fails in seconds, not minutes.
      - name: Pure-SSR guard
        run: ./scripts/check-ssr-purity.sh

      # Build-cache analog of the SSR gate: every Dockerfile must COPY the full transitive
      # .csproj closure it restores. `dotnet restore` SKIPS a missing project file and still
      # exits 0, so a stale COPY list degrades the restore layer silently and stays green.
      - name: Docker restore-graph guard
        run: ./scripts/check-dockerfile-restore-graph.sh

      # Schema analog of the SSR gate (ADR-0023 / MIGR-03): a newly-added destructive
      # migration fails in seconds unless it carries the in-file acknowledgment marker
      # (MIGRATION-SAFETY: acknowledged). The self-test runs first so the guard itself
      # can never rot green.
      - name: Migration-safety guard self-test
        run: ./scripts/tests/check-migration-safety.tests.sh

      - name: Migration-safety guard
        run: ./scripts/check-migration-safety.sh HEAD^1

      # The backlog loop's issue-provenance gate (ADR-0026) is what keeps attacker-authored text
      # on this public repo from becoming the task of an agent that auto-merges to main. It runs
      # on the maintainer's machine, never in CI — this offline self-test is the only thing that
      # stops it rotting green.
      - name: Backlog-loop provenance gate self-test
        run: ./scripts/tests/claude-loop-provenance.tests.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.100'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is repo-wide — a single warning fails this build.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Solution-wide `dotnet test` can't host the patcher's x86 native-interop suite
      # (LotroKoniecDev.Tests.Infrastructure) on the Linux runner, so target the
      # cross-platform test projects by naming convention. New suites are picked up
      # automatically; the Windows-only ones (.Tests.Infrastructure / .Tests.E2E) are
      # excluded by name.
      - name: Run Unit Tests
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r proj; do
            found=1
            echo "::group::$(basename "$proj")"
            dotnet test "$proj" --configuration Release --no-build --logger "console;verbosity=minimal"
            echo "::endgroup::"
          done < <(find tests -name '*.Tests.Unit.csproj' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::No *.Tests.Unit projects found — refusing to report a false green."
            exit 1
          fi

      # Real PostgreSQL via Testcontainers (currently AuthSystem.API.Tests.Integration;
      # the TranslationSystem.API suite joins by the same convention when M2-15 lands).
      - name: Run Integration Tests
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r proj; do
            found=1
            echo "::group::$(basename "$proj")"
            dotnet test "$proj" --configuration Release --no-build --logger "console;verbosity=minimal"
            echo "::endgroup::"
          done < <(find tests -name '*.Tests.Integration.csproj' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::No *.Tests.Integration projects found — refusing to report a false green."
            exit 1
          fi

  # Packaging gate (CI-01 / #403): build the four SHIPPED images (cd.yml's exact matrix) on the PRs
  # that can change them — Dockerfile/.dockerignore edits, incl. Dependabot base-image digest bumps —
  # so a base that breaks `dotnet publish` inside the container or carries a fixable HIGH/CRITICAL
  # goes red BEFORE the merge, not in cd.yml after it. Skipped by `if:` (never `on.paths`) for the
  # same required-check reason as the .NET job above. Nothing is pushed and no registry credentials
  # are involved, so the job also works on Dependabot PRs (read-only token, zero secrets).
  images:
    name: Build & scan image (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Surface every image's result even if one fails — a bad base usually breaks several at once.
      fail-fast: false
      matrix:
        include:
          - image: lotrokoniecdev-auth-api
            dockerfile: src/AuthSystem/LotroKoniecDev.AuthSystem.API/Dockerfile
          - image: lotrokoniecdev-tms-api
            dockerfile: src/TranslationSystem/LotroKoniecDev.TranslationSystem.API/Dockerfile
          - image: lotrokoniecdev-frontend
            dockerfile: src/Frontend/LotroKoniecDev.Frontend/Dockerfile
          - image: lotrokoniecdev-migrator
            dockerfile: Dockerfile.migrator.prod

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Same build-args and gha cache scopes as cd.yml's build-and-push, so this build reads the
      # layer cache CD warmed on main (base-branch caches are readable from PRs) and an unchanged
      # restore layer costs seconds. push: false + load: true — the image lands only in the runner's
      # local Docker daemon, for the scan below. provenance/sbom are off: the docker exporter cannot
      # carry attestation manifests; cd.yml attaches both on the real push.
      - name: Build image (local only, never pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ matrix.image }}:pr-local
          build-args: |
            BUILD_CONFIGURATION=Release
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
          provenance: false
          sbom: false

      # Same gate as cd.yml's post-push scan (severity / ignore-unfixed / exit-code), but against
      # the LOCAL image ref — no TRIVY_USERNAME/TRIVY_PASSWORD, nothing was pushed. cd.yml keeps its
      # own scan of the exact published digest right before cosign signs it; this one just moves the
      # red X onto the PR.
      - name: Scan image for vulnerabilities (Trivy — fail HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:pr-local
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
