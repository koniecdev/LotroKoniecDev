name: E2E

# Heaviest possible jobs, both via Testcontainers (the ubuntu runner has Docker preinstalled):
#   - e2e:          builds the auth/tms/migrator images, boots Postgres + migrator + both APIs, and drives
#                   the core loop over real HTTP with real auth-api tokens.
#   - e2e-frontend: additionally builds the Frontend image, boots the whole browser-facing stack (+ Mailpit +
#                   the official Testcontainers Playwright browser), and drives the register→confirm→login→
#                   logout loop in a real headless Chromium (ADR-0009).
# Both projects are named `...E2E.Tests` (not `*.Tests.Unit`/`*.Tests.Integration`), so pr-verify/ci skip
# them by convention, and the suite runs automatically in exactly ONE place: Dependabot PRs whose diff
# touches `Directory.Packages.props`, `.config/dotnet-tools.json` or a `Dockerfile*` (CI-03 / #405).
# A weekly dependency bump is precisely the moment "does the whole thing still work end to end" is being
# asked, and on a base-image bump the fixtures rebuild the images themselves — exercising the new base
# deeper than a build-and-scan can reach. Everywhere else it stays manual (workflow_dispatch, any ref):
# human PRs never run it (job-level actor gate below), a github-actions bump has nothing for E2E to
# exercise (paths filter), and it is deliberately NOT in the main ruleset's required checks — it is a
# signal the author reads before merging, not a gate, so a browser flake cannot block a security patch.
# The suite references no repository secrets, so it passes with Dependabot's read-only GITHUB_TOKEN.
# On pull_request the concurrency group resolves to `e2e-refs/pull/<n>/merge`, so a Dependabot rebase
# force-push cancels the in-flight run instead of queueing a second.
# Manual run: Actions tab or `gh workflow run e2e.yml`.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Directory.Packages.props'
      - '.config/dotnet-tools.json'
      - 'Dockerfile*'
      - '**/Dockerfile*'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (full stack via Testcontainers)
    # Dependabot-only on pull_request; a bare actor gate would also skip manual dispatches.
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/LotroKoniecDev.TranslationSystem.E2E.Tests/LotroKoniecDev.TranslationSystem.E2E.Tests.csproj

      - name: Build
        run: dotnet build tests/LotroKoniecDev.TranslationSystem.E2E.Tests/LotroKoniecDev.TranslationSystem.E2E.Tests.csproj --configuration Release --no-restore

      # The fixture shells out to `docker build` for the three images (the ubuntu runner has Docker preinstalled),
      # then boots the stack via Testcontainers — no SKIP_DOCKER_BUILD, no pre-built images.
      - name: Run E2E Tests
        run: dotnet test tests/LotroKoniecDev.TranslationSystem.E2E.Tests/LotroKoniecDev.TranslationSystem.E2E.Tests.csproj --configuration Release --no-build --logger "console;verbosity=minimal"

  e2e-frontend:
    name: E2E Frontend (browser via Testcontainers + Playwright)
    # Dependabot-only on pull_request; a bare actor gate would also skip manual dispatches.
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/LotroKoniecDev.Frontend.E2E.Tests/LotroKoniecDev.Frontend.E2E.Tests.csproj

      - name: Build
        run: dotnet build tests/LotroKoniecDev.Frontend.E2E.Tests/LotroKoniecDev.Frontend.E2E.Tests.csproj --configuration Release --no-restore

      # The fixture builds the auth/tms/frontend/migrator images, then boots the whole browser-facing stack
      # (+ Mailpit + the official Testcontainers Playwright browser) and drives it over a real headless Chromium.
      # ConnectAsync uses the in-container browser, so no `playwright install` (no host browser download) is needed.
      - name: Run Frontend E2E Tests
        run: dotnet test tests/LotroKoniecDev.Frontend.E2E.Tests/LotroKoniecDev.Frontend.E2E.Tests.csproj --configuration Release --no-build --logger "console;verbosity=minimal"
