name: Health ping (prod)

# The daily availability check for production. The probe itself stands (ADR-0027); the warm-window
# premise it was designed around died with Azure Container Apps (ADR-0034 / #492), and so did the
# Application Insights web tests it replaced.
#
# The apps now run 24/7 on the Hetzner box, so this is no longer about warming anything up: it is a
# plain "tell me in the morning if it died overnight" check against the public origins, covering the
# containers, Caddy's TLS, and — through the deep /health below — the Neon database, which DOES still
# scale to zero. It runs on free GitHub-hosted minutes once a day; the retry loop below out-waits a
# Neon resume, so a suspended database wakes rather than reds the run.
#
# Failure notification is GitHub's own: a failed scheduled run emails the user whose commit last
# touched this file. No paid alerting.
#
# Cron is UTC. 06:40 UTC = 08:40 Europe/Warsaw in summer (CEST), 07:40 in winter (CET) — a morning
# signal. GitHub delays scheduled crons by up to hours; with no warm window left to land inside, that
# only shifts when the mail arrives.

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-ping
  cancel-in-progress: false

jobs:
  ping:
    name: probe the public origins
    # Never run on a fork: the origins below belong to this deployment only.
    if: github.repository == 'koniecdev/LotroKoniecDev'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe auth, tms and the frontend
        run: |
          set -uo pipefail

          # The public origins of the prod environment (the Caddy vhosts in
          # .docker/hetzner/Caddyfile, driven by the domains in /opt/lotro/.env on the prod box).
          #
          # The APIs are probed on /health, not /health/ready: ADR-0025 deliberately leaves the
          # Postgres check OUT of the readiness tag so the container probes cannot keep the
          # scale-to-zero Neon compute awake — that ruling outlives Azure, because Neon still
          # suspends — and names the full /health as the on-demand deep check. Once a day is exactly
          # that occasion — this is the only probe that proves the database is reachable.
          # auth's /health also covers SMTP and the in-stack RabbitMQ broker, so a red run here can
          # legitimately mean "Brevo is down" or "the broker container is down" — not "the site is
          # down"; the response body below says which check failed.
          #
          # The Static-SSR frontend exposes /health/live but nothing deep, so '/' is its liveness.
          probe() {
            name="$1"; url="$2"; lo="$3"; hi="$4"
            code=000
            echo "::group::${name} → ${url}"
            for attempt in $(seq 1 20); do
              code=$(curl -sS -o /tmp/probe-body.txt -w '%{http_code}' --max-time 60 "$url" || echo 000)
              echo "  attempt ${attempt}: HTTP ${code}"
              if [ "$code" -ge "$lo" ] 2>/dev/null && [ "$code" -le "$hi" ] 2>/dev/null; then
                echo "::endgroup::"
                printf -- '- OK **%s** — HTTP %s (after %s attempt(s))\n' "$name" "$code" "$attempt" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              # A measured cold start from zero replicas is ~45-60 s (auth's own is ~31 s and dominates
              # the chain), so a single attempt must out-wait it: --max-time 60 above, 20 x 10 s here.
              sleep 10
            done
            echo "  last response body:"
            head -c 2000 /tmp/probe-body.txt || true
            echo
            echo "::endgroup::"
            echo "::error::${name} is unhealthy (last HTTP ${code}): ${url}"
            # The backticks in the printf formats are markdown for the job summary,
            # not command substitution — nothing here is meant to expand.
            # shellcheck disable=SC2016
            {
              printf -- '- FAIL **%s** — HTTP %s at `%s`\n\n' "$name" "$code" "$url"
              printf -- '```\n%s\n```\n' "$(head -c 1000 /tmp/probe-body.txt)"
            } >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          echo '## Prod health ping' >> "$GITHUB_STEP_SUMMARY"

          failed=0
          probe auth     "https://auth.lotro-translator.pl/health" 200 200 || failed=1
          probe tms      "https://tms.lotro-translator.pl/health"  200 200 || failed=1
          probe frontend "https://lotro-translator.pl/"            200 399 || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "::error::Production health ping failed — see the job summary."
            exit 1
          fi
          echo "All three origins are healthy."
