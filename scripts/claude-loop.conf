# This repository's settings for the backlog loop in scripts/claude/ (scripts/claude/CONTRACT.md,
# section 2). One key=value per line, read as text and never run. A change here is reviewed like
# code: the loop runs only the settings on origin/main.
contract=1
repo=koniecdev/LotroKoniecDev
gh_user=koniecdev
claude_config_dir=.claude-account1
# The repository is public, so issue text from outside the writers never reaches a session
# (ADR-0026). Widen these two lists only with an ADR.
provenance_gate=on
trusted_associations=OWNER,MEMBER,COLLABORATOR
trusted_logins=
require_private=off
red_main_workflow=
code_scanning=on
e2e_image_label=lotrokoniecdev.e2e
skip_labels=loop-blocked,epic,question,wontfix,invalid,duplicate,audit,post-mvp
skip_titles=^M4-
skip_issues=85
