# Observability stack for the Hetzner fleet — the first cut of epic #707, decided by ADR-0050.
#
# This is deliberately NOT a service block inside compose.hetzner.yaml. That file is a CD artifact:
# deploy.sh overwrites it and runs `up -d --remove-orphans` on every rollout, which would tie the
# lifetime of the monitoring to the lifetime of the thing it monitors (ADR-0050 §2). This file is
# its own compose project, lives in /opt/obs, and is deployed by hand.
#
# ONE file serves both roles; the env file next to it picks which (see .env.observability.example):
#
#   staging box  COMPOSE_PROFILES=backend   Grafana + Loki + Prometheus + Tempo + Alloy
#   prod box     COMPOSE_PROFILES=          Alloy only, pushing to the backend on staging through
#                                           the obs.<domain> ingest vhost (ADR-0050 §4, #755)
#
# The same switch picks the agent's "ship" file: alloy/ship.backend.alloy writes to the backend
# containers next door in plain HTTP/gRPC, alloy/ship.agent.alloy crosses the box boundary over TLS
# with one basic-auth credential. Everything else about the agent is identical on both boxes.
#
# The backend runs on STAGING on purpose. A backend co-hosted with the workload it observes dies in
# the same outage and takes the evidence with it; on staging, a prod outage — the one that matters —
# leaves the dashboards and prod's last minutes of telemetry readable (ADR-0050 §1).
#
# NOTHING here is published to the internet by THIS file:
#   * Grafana binds to 127.0.0.1 on the box. Reach it with an ssh tunnel:
#       ssh -L 3000:127.0.0.1:3000 lotro-staging   → http://localhost:3000
#     The only public entry point is the ingest vhost the LotroKoniecDev Caddy serves on the backend
#     box — three push paths, one source /32, one credential, everything else a 404 (ADR-0050 §4).
#     Grafana is deliberately not behind it (runbook → "Observability & monitoring").
#   * Alloy's OTLP receiver binds to OBS_OTLP_BIND_ADDRESS, which is a DOCKER BRIDGE GATEWAY
#     (10.61.0.1 = the tks network's gateway on the staging box), never 0.0.0.0. A published port
#     on 0.0.0.0 would be reachable from the internet: Docker's iptables rules are inserted ahead
#     of ufw, so `ufw deny` does not cover a published port (bootstrap.sh:286).
#   * Loki, Prometheus and Tempo publish nothing at all; Grafana, Alloy and — for the other box's
#     pushes — Caddy reach them over the `obs` network.
#
# No container here joins `default` or `tks`. Alloy reads the Docker socket and /proc — it never
# needs a route to an application container, and it must not have one (ADR-0050 §3: the cross-stack
# pivot #506 closed does not get reopened under a friendlier name). The `obs` network itself belongs
# to the LotroKoniecDev stack (`${COMPOSE_PROJECT_NAME}_obs`, joined here as external) so that Caddy
# can sit on it — the same shape as `tks`, and the reason that stack must have deployed at least
# once since #755 before this project can start.

# Who the kernel kills when the BOX runs out of memory (#786) — the observability half of the
# policy whose application half lives in compose.hetzner.yaml (read that header first).
#
# The four backend components are staging-only (the `backend` profile), so their value is a literal:
# they exist on exactly one box and their role never changes. `alloy` is NOT one of them. It carries
# no profile, it runs on BOTH boxes from this single definition, and its role INVERTS between them —
# production-critical on the staging box, the designated first victim on prod. No literal can
# express that, because the host's own daemons sit at oom_score_adj 0 on both boxes and form a fixed
# line the agent has to be BELOW on staging and ABOVE on prod. Hence a per-box knob, the same shape
# as OBS_BOX and OBS_ENVIRONMENT: one file, both roles, the env file next to it picks which.
#
# (A literal here would also be self-defeating on prod. The agent is capped at mem_limit 512m below,
# so a negative value pins its oom_score under the host daemons' ~672 no matter how much memory it
# is holding — the box would be taken apart daemon by daemon before the container the policy names.)

name: obs

services:
  # ---------------------------------------------------------------------------------------------
  # Agent — runs on EVERY box. Three jobs: tail every container's stdout, accept OTLP from the
  # apps, and scrape the host and the containers.
  # ---------------------------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: obs-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # A directory, not a file: Alloy loads every *.alloy in it — config.alloy (the same on every
      # box) plus the role's ship file, mounted as ship.alloy below. It relies on those two being the
      # ONLY *.alloy files there: the image ships /etc/alloy/config.alloy, which the mount replaces,
      # and a third file (a future image, a scratch file mounted next to these) would load as well
      # and collide on the component names.
      - /etc/alloy
    environment:
      # The two labels every signal off this box carries. `environment` is the ONLY thing that
      # separates staging from prod in Grafana — both boxes run ASPNETCORE_ENVIRONMENT=Production.
      OBS_BOX: ${OBS_BOX:?OBS_BOX must be set (lotro-staging | lotro-prod)}
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:?OBS_ENVIRONMENT must be set (staging | production)}
      # Agent-only boxes: the backend's public hostname and the credential its Caddy checks
      # (ship.agent.alloy). Blank on the backend box, whose ship file never reads them.
      OBS_BACKEND_HOST: ${OBS_BACKEND_HOST:-}
      OBS_PUSH_USER: ${OBS_PUSH_USER:-}
      OBS_PUSH_PASSWORD: ${OBS_PUSH_PASSWORD:-}
    ports:
      # OTLP in, from the application containers. Bound to bridge GATEWAYS, never 0.0.0.0 and never
      # the public IP: a port published on 0.0.0.0 is reachable from the internet regardless of ufw,
      # because Docker inserts its DNAT rules ahead of the ufw chain.
      #
      # Two of them, because the two stacks sit on two segregated networks and Alloy joins neither
      # (ADR-0050 §3 - an agent that could reach an app container is the cross-stack pivot #506
      # closed). Each stack reaches the agent through its own gateway instead:
      #   OBS_OTLP_BIND_LOTRO = 10.60.0.1  → our own apps
      #   OBS_OTLP_BIND_TKS   = 10.61.0.1  → the guest TheKittySaver stack
      # The defaults differ only so that an unset pair does not collide on one loopback port.
      - "${OBS_OTLP_BIND_LOTRO:-127.0.0.1}:4317:4317"
      - "${OBS_OTLP_BIND_LOTRO:-127.0.0.1}:4318:4318"
      - "${OBS_OTLP_BIND_TKS:-127.0.0.2}:4317:4317"
      - "${OBS_OTLP_BIND_TKS:-127.0.0.2}:4318:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # The role's ship file, picked by the SAME switch that picks the role: COMPOSE_PROFILES is
      # `backend` on the backend box and empty on an agent-only box, and `:-agent` turns that empty
      # into ship.agent.alloy. One switch, so the two cannot disagree — but only while the value is
      # EXACTLY `backend` or empty, which `preflight` below enforces, and only while the value comes
      # from the env file: `docker compose --profile backend` sets the profile without setting the
      # variable, so this project is brought up with the env file and never that flag. `preflight`
      # below catches both halves of that — see its comment.
      #
      # Long syntax for `create_host_path: false`. The short form would CREATE a missing source as an
      # empty directory and mount it over the config — Alloy then loads no ship file, every pipeline
      # forwards to a component that does not exist, and a stray directory is left in /opt/obs/alloy.
      - type: bind
        source: ./alloy/ship.${COMPOSE_PROFILES:-agent}.alloy
        target: /etc/alloy/ship.alloy
        read_only: true
        bind:
          create_host_path: false
      # Read-only socket: the log tailer and the cadvisor exporter both read container state
      # through it. Read-only is not a real security boundary (the socket is root-equivalent by
      # design) but it does stop this container from creating or killing one by accident.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cadvisor needs containerd too, not just Docker: with the overlayfs storage driver it
      # asks containerd for the container metadata, and without this socket it fails EVERY
      # docker cgroup with "cannot unix dial containerd api service" — while still happily
      # reporting the host's systemd slices, so the scrape looks alive and simply has no
      # containers in it.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      # Two exporters, two mount conventions, and they are NOT interchangeable:
      #   * the unix (node) exporter is pointed at /host/* by its own path options;
      #   * the embedded cadvisor has no path options — it reads /sys/fs/cgroup and
      #     /var/lib/docker at their REAL paths. Give it only /host/sys and it discovers exactly
      #     one cgroup (the root), which looks like "metrics are working" right up until you try
      #     to break them down per container.
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - obs
    depends_on:
      preflight:
        condition: service_completed_successfully
    # The one value in this file that differs per box — see the header.
    #   staging (backend role): -300, the most protected container in the project. Note what that
    #     is NOT for: prod does not push through this agent. The prod box's agent goes through the
    #     ingest vhost on Caddy straight into loki / prometheus / tempo (ADR-0050 §4), so nothing
    #     here is in prod's path. It earns the depth on its own box — it is the only OTLP receiver
    #     and the only log tailer for BOTH application stacks, and the only source of the host and
    #     container metrics the fleet rules read, including the rule watching this stack's own
    #     memory. It is also the fattest container here (512 MiB ceiling), which is exactly what
    #     would make the kernel pick it first if nothing said otherwise.
    #   prod (agent-only role): +300, the box's designated first victim. Losing it costs telemetry;
    #     losing anything else there costs the product. The positive value is what puts it above the
    #     host's own daemons, so the kernel reaches it FIRST instead of a dozen system services.
    oom_score_adj: ${OBS_ALLOY_OOM_SCORE_ADJ:?OBS_ALLOY_OOM_SCORE_ADJ must be set in /opt/obs/.env — -300 on the backend (staging) box, 300 on an agent-only (prod) box (see the header of this file and .env.observability.example)}
    # 512m, not 256m as ADR-0050 predicted: Alloy is the heaviest component here, not the
    # lightest. It carries the cadvisor exporter across every container on the box AND the
    # whole OTLP pipeline for both projects, and it grew from 144 MiB to 285 MiB the moment
    # the second project started exporting. It also gets the most headroom on purpose: it is
    # the one component whose death stops ALL telemetry, and stops it silently.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------------------------
  # Backend — staging box only (COMPOSE_PROFILES=backend).
  # ---------------------------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.7
    container_name: obs-loki
    profiles: ["backend"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - obs
    # Backend tier — staging only, so a literal. Recoverable and loud: Alloy retries what it
    # could not push, and an operator notices a gap in Explore.
    oom_score_adj: -200
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: obs-prometheus
    profiles: ["backend"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Two caps, whichever hits first. The SIZE cap is the one that matters: it is enforced by the
      # store, so no upstream mistake can make Prometheus outgrow it (ADR-0050 §8).
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      # Alloy pushes; Prometheus scrapes nothing. Scraping an app container would put this process
      # on an application network, which is exactly what ADR-0050 §3 forbids.
      - --web.enable-remote-write-receiver
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - obs
    # Backend tier — staging only, so a literal (same reasoning as loki).
    oom_score_adj: -200
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    image: grafana/tempo:2.10.8
    container_name: obs-tempo
    profiles: ["backend"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - obs
    # 384m, not the 192m ADR-0051 measured. That measurement was taken with nobody querying: it is
    # Tempo's ingest footprint, and serving a search decompresses blocks on top of it. One Grafana
    # user browsing traces on 2026-09-09 took this container from 95 MiB steady to an OOM-kill at
    # anon-rss 184 MB (#782). The query path is capped in tempo.yaml as well — the limit and the
    # cap belong together, because either one alone still lets a query ask for the whole container.
    # Backend tier — staging only, so a literal (same reasoning as loki).
    oom_score_adj: -200
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # What `${VAR:?}` cannot express. Interpolation guards a variable, one at a time, with no idea
  # which role the box is in — and it runs for EVERY service before profiles are applied, so a
  # backend-only guard also breaks the agent-only role. This one-shot has no profile (both roles run
  # it, and alloy + grafana wait for it) and knows the role, so it can check the three things that
  # decide whether this box works at all:
  #
  #   * The role and the box agree. Each branch asserts what the OTHER role's variables must look
  #     like, because the value that picks the role also picks the ship file, and picking it wrong is
  #     the one mistake that leaves a box looking healthy while it ships nothing. The live line in
  #     the template is `COMPOSE_PROFILES=backend`; left unedited on the prod box it would start a
  #     whole backend there, mount the wrong ship file, and — because the absence rule self-arms on
  #     first sight of a box — leave prod unwatched with nothing anywhere saying so. Push variables
  #     alongside `backend` are that contradiction, and they fail here.
  #     (A value naming no file at all — a comma list, a typo — never reaches this check: the bind
  #     mount fails first, on a missing source. The values this catches are the ones that name a
  #     real file, and the CLI `--profile backend` case, which leaves the variable empty and so
  #     lands in the agent branch below with nothing to push with.)
  #   * On an agent-only box the push target and credential are set. They cannot be `:?`-guarded:
  #     the backend box leaves them blank on purpose, and its ship file never reads them. Blank on
  #     an agent box builds `https:///loki/api/v1/push` and an OTLP endpoint of `:443`, which retry
  #     against nothing at warn level while the self-arming absence rule — never having seen this
  #     box — stays quiet. A misconfigured agent would be indistinguishable from an absent one.
  #   * The agent's OOM ranking carries the SIGN its role requires (#786). Interpolation can only
  #     demand that the value exists, and one that exists with the wrong sign is silent everywhere
  #     else — the box comes up healthy and ships telemetry, and the only symptom is that a
  #     box-level OOM would kill exactly the wrong container. It is the same mistake the role line
  #     invites (the template ships the BACKEND value live), so it is caught in the same place.
  preflight:
    image: alpine:3.22
    network_mode: none
    # Backend tier, although this one-shot runs in BOTH roles: it exits in milliseconds and holds no
    # memory, and ranking it with the project it gates keeps "no observability container outranks an
    # application" true of every service in this file without an exception to remember.
    oom_score_adj: -200
    environment:
      OBS_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      OBS_BACKEND_HOST: ${OBS_BACKEND_HOST:-}
      OBS_PUSH_USER: ${OBS_PUSH_USER:-}
      OBS_PUSH_PASSWORD: ${OBS_PUSH_PASSWORD:-}
      OBS_ALLOY_OOM_SCORE_ADJ: ${OBS_ALLOY_OOM_SCORE_ADJ:-}
    command:
      - sh
      - -ec
      - |
        case "$$OBS_COMPOSE_PROFILES" in
          backend)
            echo "preflight: backend role (Grafana, Loki, Prometheus, Tempo + the agent)"
            for v in OBS_BACKEND_HOST OBS_PUSH_USER OBS_PUSH_PASSWORD; do
              printenv "$$v" | grep -q . && {
                echo "preflight: $$v is set, but this box claims the BACKEND role -- a backend box pushes to the containers next door and has nothing to authenticate to. Did COMPOSE_PROFILES=backend survive a copy of the template onto an agent-only box? (.env.observability.example)" >&2
                exit 1; }
            done
            [ "$${OBS_ALLOY_OOM_SCORE_ADJ:-0}" -lt 0 ] || {
              echo "preflight: OBS_ALLOY_OOM_SCORE_ADJ is '$$OBS_ALLOY_OOM_SCORE_ADJ', but a BACKEND box needs a NEGATIVE value (-300): here the agent is protected, and only an agent-only box makes it the first victim. Did the template reach the wrong box? (#786)" >&2
              exit 1; }
            true ;;
          "")
            echo "preflight: agent-only role"
            for v in OBS_BACKEND_HOST OBS_PUSH_USER OBS_PUSH_PASSWORD; do
              printenv "$$v" | grep -q . || {
                echo "preflight: $$v must be set in /opt/obs/.env on an agent-only box" >&2; exit 1; }
            done
            [ "$${OBS_ALLOY_OOM_SCORE_ADJ:-0}" -gt 0 ] || {
              echo "preflight: OBS_ALLOY_OOM_SCORE_ADJ is '$$OBS_ALLOY_OOM_SCORE_ADJ', but an AGENT-ONLY box needs a POSITIVE value (300): the agent is this box's designated first victim and the host's own daemons sit at 0, so a negative value hides it behind them. Did the backend value survive a copy of the template? (#786)" >&2
              exit 1; }
            ;;
          *)
            echo "preflight: COMPOSE_PROFILES must be exactly 'backend' or empty, not '$$OBS_COMPOSE_PROFILES' -- it picks the ship file" >&2
            exit 1 ;;
        esac

  grafana:
    image: grafana/grafana:13.0.7
    container_name: obs-grafana
    profiles: ["backend"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      # `:?` and not the preflight: this one has to fire on EVERY invocation that renders this
      # service, `docker compose up -d --no-deps grafana` included — empty is not an error to
      # Grafana, it is a silent fall back to the built-in admin/admin. An agent-only box carries a
      # placeholder for it (.env.observability.example) because interpolation runs before profiles.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set; on an agent-only box set it to any placeholder — see .env.observability.example}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Alert delivery. Reuses the Brevo sender the apps already use — an unauthenticated sender is
      # silently DROPPED by Brevo, so this must stay a verified address (runbook, Brevo gotcha).
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-true}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-smtp-relay.brevo.com:587}
      GF_SMTP_USER: ${GF_SMTP_USER:?GF_SMTP_USER must be set; placeholder on an agent-only box}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:?GF_SMTP_PASSWORD must be set; placeholder on an agent-only box}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:?GF_SMTP_FROM_ADDRESS must be set; placeholder on an agent-only box}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Grafana (Hetzner fleet)}
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
      # Read by the provisioned contact point — empty renders a contact point with no address, and
      # every alert is then delivered nowhere, in silence.
      OBS_ALERT_EMAIL: ${OBS_ALERT_EMAIL:?OBS_ALERT_EMAIL must be set; placeholder on an agent-only box}
    ports:
      # LOOPBACK ONLY. Reach it over an ssh tunnel; see the header.
      - "127.0.0.1:${OBS_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - obs
    # Backend tier — staging only, so a literal. It is the alerting engine as well as the UI, but it
    # restarts in seconds and its absence is the most visible thing on the box.
    oom_score_adj: -200
    depends_on:
      preflight:
        condition: service_completed_successfully
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    # 512m, up from 384m. Grafana was found at 86% of the old ceiling during the same trace-browsing
    # session that killed Tempo (#782): a dashboard or a Drilldown query holds its result sets in the
    # process, so the peak follows whoever is looking at it, not the size of the fleet. It is second
    # only to Alloy for the same reason Alloy leads — being killed here is being killed while someone
    # is trying to look at an incident.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# The network belongs to the LotroKoniecDev stack (compose.hetzner.yaml declares it as
# `${COMPOSE_PROJECT_NAME}_obs`, next to `tks`) and this project joins it — the reverse of the first
# cut, which owned `obs_obs` outright. Caddy has to sit on this network to proxy the other box's
# pushes to loki/prometheus/tempo (ADR-0050 §4), and a CD artifact cannot join a hand-deployed
# project's network without an ordering hazard on every fresh box, while a hand-deployed project
# joining the CD stack's network has none: that stack always exists first (ADR-0050 §2, #755).
networks:
  obs:
    external: true
    name: ${OBS_NETWORK:?OBS_NETWORK must be set (lotro-staging_obs | lotro-prod_obs)}

volumes:
  alloy-data:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:
