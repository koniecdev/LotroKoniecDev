# Fleet alert rules (#713) — the half that belongs to neither project.
#
# Box saturation is not a project's property. Both stacks share the hardware, so when a box runs out
# of memory the kernel picks a victim by its own accounting and it may well belong to the project
# that did not cause it. These rules therefore live in their own folder, name the box rather than a
# project, and say so in their descriptions.
#
# Delivery reuses the single `owner-email` contact point (#713 wanted exactly one channel).
apiVersion: 1

groups:
  - orgId: 1
    name: fleet
    folder: Fleet
    interval: 1m
    rules:

      - uid: fleet-memory-saturation
        title: Fleet — box memory is nearly exhausted
        condition: C
        for: 10m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.box }} has under 15% of its memory available'
          description: >-
            THE BOX IS SHARED between LotroKoniecDev and TheKittySaver. The container the kernel
            kills is not necessarily the one that caused this — check the per-project memory panel
            before attributing it. Swap (#708) turns what used to be an instant OOM-kill into a slow
            box, so this alert now arrives with time to act rather than after the fact.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                1 - (max by (box) (node_memory_MemAvailable_bytes) / max by (box) (node_memory_MemTotal_bytes))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.85] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: NoData
        execErrState: Error

      - uid: fleet-container-near-memory-limit
        title: Fleet — a container is close to its memory limit
        condition: C
        for: 3m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.name }} on {{ $labels.box }} is above 85% of its own memory limit'
          description: >-
            A cgroup OOM-kill is invisible to every other rule here. The box keeps its free memory,
            so the saturation rule stays quiet; the container restarts in place, so the crash-loop
            rule sees no new start time; and Docker's restart policy brings it back within seconds,
            so nothing is down long enough to notice. That is exactly how Tempo died unobserved on
            2026-09-09 (#782) with 1.5 GiB free on the box.
            THE OOM COUNTERS DO NOT WORK HERE. Both `container_oom_events_total` and
            `container_memory_failcnt` stayed at 0 across that kill — the counter belongs to the
            cgroup, and the restart makes a new one. The ratio below peaked at 0.9995 in the same
            window and is the only signal that saw it, which is why this rule watches the approach
            rather than the event.
            Containers with no `mem_limit` report a limit of 0 and are excluded by the `> 0` guard.
            They are not covered by this rule and cannot be — for those the box-level saturation
            rule is the only net.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                max by (box, name) (
                  container_memory_working_set_bytes{name!=""}
                  / (container_spec_memory_limit_bytes{name!=""} > 0)
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.85] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: NoData
        execErrState: Error

      # The uid is older than this rule: until #1084 it fired on how full swap was. It was kept so
      # the alert history stays linked.
      - uid: fleet-swap-in-use
        title: Fleet — the box is swapping hard or waiting for memory
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.box }} moved memory in and out of swap fast over the last 30 minutes, or its programs are waiting for memory'
          description: >-
            THE BOX IS SHARED between LotroKoniecDev and TheKittySaver. The box does not have enough
            memory for what runs on it now, so trim what grew before the memory alert fires. Either
            of two signals fires this rule: over the last 30 minutes, more than 350 pages a second
            (about 1.4 MiB/s) moved in and out of swap on average, or at least one program was
            waiting for memory during more than 10% of the last 5 minutes. Because of the 30-minute
            average, the alert stays on for up to half an hour after the swapping stops. How full
            swap is does not fire this rule. Linux moves memory that nothing uses into swap and
            leaves it there, so swap fills slowly even on a calm box. The swap-nearly-full rule
            watches that.
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              # Two yes/no checks added together: the value is 1 or 2 when either one holds. `+`
              # keeps only boxes that have both series, so the two `or` lines bring back a box that
              # has one (a PSI-less kernel, or a scrape gap that empties the 5m rate first). The
              # lines come from both boxes' history (runbook, "What the two swap rules measure").
              # The real squeezes came as bursts of 5 to 15 minutes, so a long `for:` on a short
              # rate never fires. The volume over half an hour is what separates them from a
              # normal CI job. A page is 4 KiB.
              expr: >-
                (max by (box) (rate(node_vmstat_pswpin[30m]) + rate(node_vmstat_pswpout[30m])) > bool 350)
                + (max by (box) (rate(node_pressure_memory_waiting_seconds_total[5m])) > bool 0.10)
                or (max by (box) (rate(node_vmstat_pswpin[30m]) + rate(node_vmstat_pswpout[30m])) > bool 350)
                or (max by (box) (rate(node_pressure_memory_waiting_seconds_total[5m])) > bool 0.10)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: NoData
        execErrState: Error

      - uid: fleet-swap-nearly-full
        title: Fleet — box swap is nearly full
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.box }} has used more than 70% of its swap'
          description: >-
            THE BOX IS SHARED between LotroKoniecDev and TheKittySaver. This is the late guard
            (#1084). Less than about 600 MiB of swap is left, and one ordinary CI job pushed 650 MiB
            into swap in five minutes on 2026-10-09. So the next such burst can fill swap, and then
            the kernel kills a container. A calm box can reach this line too, because swap empties
            only when something reads the memory back or the process that owns it ends. Find what
            holds it: a container that grew (restart it), or old files in /tmp, which is memory on
            these boxes (runbook, "What the two swap rules measure"). A box with no swap at all
            reads as 100% used here too, so check `swapon --show` first.
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              # clamp_min keeps the ratio from becoming 0/0 = NaN on a box with swap disabled. Such
              # a box reads as 100% used and fires. That is true for this guard: it has no swap left
              # to absorb a burst, and every box is meant to have swap since #708.
              expr: >-
                1 - (max by (box) (node_memory_SwapFree_bytes) / clamp_min(max by (box) (node_memory_SwapTotal_bytes), 1))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.70] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: NoData
        execErrState: Error

      - uid: fleet-cpu-saturation
        title: Fleet — box CPU is saturated
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.box }} has been above 85% CPU for 15 minutes'
          description: >-
            Sustained, not a spike — a build, a backup or a compaction is expected to pin these two
            vCPUs briefly. Shared box: the load may belong to either project.
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                1 - avg by (box) (rate(node_cpu_seconds_total{mode="idle"}[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.85] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: NoData
        execErrState: Error

      - uid: fleet-disk-low
        title: Fleet — box disk below 20% free
        condition: C
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.box }} has under 20% disk free'
          description: >-
            ADR-0050 §8's backstop. Prometheus is hard-capped at 4 GB by the store itself, but Loki
            has NO size-based retention — its 14-day window is bounded only by ingestion rate limits,
            which bound the pathological case without turning retention into a byte ceiling. This
            alert is what catches the difference between those two guarantees before the disk fills.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                max by (box) (node_filesystem_avail_bytes{mountpoint="/"}) / max by (box) (node_filesystem_size_bytes{mountpoint="/"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.20] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: NoData
        execErrState: Error

      - uid: fleet-disk-critical
        title: Fleet — box disk below 10% free
        condition: C
        for: 5m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.box }} has under 10% disk free'
          description: >-
            The second of ADR-0050 §8's two thresholds. At this point stop reading and free space:
            a full disk takes Postgres, the container runtime and the observability stack itself with
            it, and the stack going down is how you stop finding out about any of this.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                max by (box) (node_filesystem_avail_bytes{mountpoint="/"}) / max by (box) (node_filesystem_size_bytes{mountpoint="/"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.10] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: NoData
        execErrState: Error

      - uid: fleet-box-telemetry-absent
        title: Fleet — a box has gone silent
        condition: C
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'No telemetry from {{ $labels.box }} for 20 minutes'
          description: >-
            Fifteen minutes with nothing from this box, held for another five before paging — the
            wait the bring-up procedure tells you to expect. The box's agent has stopped pushing:
            the agent died, the box died, or — for the box that ships across the boundary
            (ADR-0050 §4) — the ingest route is broken. Whatever it is, every panel for that box is
            now a flat line that LOOKS healthy, and every other rule is blind to it. This is the
            absence alert ADR-0050 §1 promised. If it is the prod box, the daily health ping is the
            only thing still watching it; check the box first (`ssh lotro-prod uptime`), then
            `docker logs obs-alloy` there — a 401 on every push means the credential no longer
            matches, a 404 means the source address the vhost admits does not. What this does NOT
            cover: it keys on a metric, and the vhost carries metrics, logs and traces on three
            separate routes, so a break confined to the Loki or the Tempo route leaves this rule
            quiet. If one signal is missing and this has not fired, check all three.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              # Self-arming: a box that has NEVER reported is not alerted on, a box that reported
              # within the last 7 days and went quiet is. This is what lets the rule ship before the
              # prod agent exists without firing permanently and training its reader to ignore it —
              # the reason it was left out of #713. Two consequences of the 7-day arm, both accepted:
              # a box silent for longer than that stops alerting (by then 28 repeat mails have gone
              # out, at repeat_interval 6h), and a DECOMMISSIONED box pages for a week — silence the
              # rule for it, or take the box out of the expression, when that day comes.
              expr: >-
                (
                  absent_over_time(node_uname_info{box="lotro-prod"}[15m])
                  and on() count(count_over_time(node_uname_info{box="lotro-prod"}[7d])) > 0
                ) or (
                  absent_over_time(node_uname_info{box="lotro-staging"}[15m])
                  and on() count(count_over_time(node_uname_info{box="lotro-staging"}[7d])) > 0
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
