name: CI

# Post-merge backstop on main: re-runs the full gate (Release build + unit + integration)
# to catch anything that slipped past PR verification — direct pushes to main, or a PR that
# went green against an older main. The integration suite spins up postgres:17-alpine via
# Testcontainers; the ubuntu runner has Docker preinstalled.
#
# Unlike pr-verify, this workflow does NOT self-skip its .NET steps via scripts/ci/classify-changes.sh:
# CD is triggered by THIS workflow concluding `success` (cd.yml, workflow_run), so "CI was green"
# must keep meaning "the build and both suites actually ran on this commit". Cheap-change filtering
# lives in `paths-ignore` instead — a push that matches it triggers no CI and therefore no CD, which
# is the intended behavior for content that ships nothing (docs, agent config).
on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 2 brings the pushed commit plus its parent, so the migration-safety
          # guard can diff newly-added files against HEAD^1. Main is squash-merge-only, so a
          # push is normally one commit; a rare multi-commit direct push gets only its last
          # commit scanned here — pr-verify is the enforcement, this job is the backstop.
          fetch-depth: 2
          persist-credentials: false

      # Same Frontend markup gate as pr-verify — backstops direct pushes to main.
      - name: Frontend markup guard self-test
        run: ./scripts/tests/check-ssr-purity.tests.sh

      - name: Frontend markup guard
        run: ./scripts/check-ssr-purity.sh

      - name: Smoke CSP ladder self-test
        run: ./scripts/tests/smoke-csp.tests.sh

      # Same hypermedia gate as pr-verify — backstops direct pushes to main.
      - name: Client hypermedia guard
        run: ./scripts/check-client-hypermedia.sh

      # Same restore-graph gate as pr-verify — backstops direct pushes to main.
      - name: Docker restore-graph guard
        run: ./scripts/check-dockerfile-restore-graph.sh

      # Same migration-safety gate as pr-verify (ADR-0023 / MIGR-03) — backstops direct
      # pushes to main.
      - name: Migration-safety guard self-test
        run: ./scripts/tests/check-migration-safety.tests.sh

      - name: Migration-safety guard
        run: ./scripts/check-migration-safety.sh HEAD^1

      # Same provenance-gate self-test as pr-verify (ADR-0026) — backstops direct pushes to main.
      - name: Backlog-loop provenance gate self-test
        run: ./scripts/tests/claude-loop-provenance.tests.sh

      # Same Hetzner rollout self-test as pr-verify (HETZ-04) — CD is triggered by THIS workflow
      # concluding success, so the script CD is about to run on a prod box gets checked here too.
      - name: Hetzner deploy script self-test
        run: ./scripts/tests/hetzner-deploy.tests.sh

      # Same three N-1 promotion gate self-tests as pr-verify (#534, #679) — CD is triggered by THIS
      # workflow concluding success, so every script the prod leg is about to run gets checked here too.
      - name: Prod-baseline resolution self-test
        run: ./scripts/tests/resolve-prod-baseline.tests.sh

      - name: N-1 promotion gate verdict self-test
        run: ./scripts/tests/n1-promotion-gate.tests.sh

      - name: N-1 proof classification self-test
        run: ./scripts/tests/n1-compat.tests.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # See pr-verify.yml for why we target test projects by name rather than the solution.
      # The same name-based selection scopes the coverage report (CI-04): only the suites
      # that actually run here feed it — E2E projects never do.
      - name: Run Unit Tests
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r proj; do
            found=1
            echo "::group::$(basename "$proj")"
            dotnet test "$proj" --configuration Release --no-build --logger "console;verbosity=minimal" \
              --collect "XPlat Code Coverage" --results-directory coverage-results
            echo "::endgroup::"
          done < <(find tests -name '*.Tests.Unit.csproj' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::No *.Tests.Unit projects found — refusing to report a false green."
            exit 1
          fi

      # Real PostgreSQL via Testcontainers (currently AuthSystem.API.Tests.Integration;
      # the TranslationSystem.API integration suite joins by the same convention when M2-15 lands).
      - name: Run Integration Tests
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r proj; do
            found=1
            echo "::group::$(basename "$proj")"
            dotnet test "$proj" --configuration Release --no-build --logger "console;verbosity=minimal" \
              --collect "XPlat Code Coverage" --results-directory coverage-results
            echo "::endgroup::"
          done < <(find tests -name '*.Tests.Integration.csproj' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::No *.Tests.Integration projects found — refusing to report a false green."
            exit 1
          fi

      # Coverage is a REPORT, not a gate (CI-04 / #525) — deliberate decision, do not add a
      # threshold "while at it". Coverage measures executed code, not verified behavior; the
      # enforced quality signal stays the Stryker mutation score (mutation-test.yml, break: 67).
      # Running it here too keeps a current coverage baseline artifact on every main build.
      # No step here fails because of a coverage number.
      - name: Coverage report (report-only, never a gate)
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet reportgenerator \
            -reports:"coverage-results/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-main-${{ github.run_number }}
          path: coverage-report/
          retention-days: 14
