# Dependabot — automated dependency freshness (audit #0001 / H1).
# Keeps the auth server and the four shipped images on patched dependencies, and surfaces newer
# action versions to pin against (the SHA-pinning follow-up, H6).
#
# Target shape: exactly ONE pull request per ecosystem per week -- nuget, github-actions, docker.
# Three is the floor, not a preference: Dependabot raises pull requests per ecosystem and cannot
# combine across them. Every group below therefore matches "*" with no `update-types` filter, so
# nothing can fall outside a group and earn a pull request of its own.
# The fourth entry, docker-compose, is the one exception. It opens at most two pull requests: one
# for Caddy and one for the observability group, each only in a week when a new image is out (a new
# release, or Docker Hub rebuilding a pinned tag). A normal week still brings three. Both carry
# `on-hold`, so /merge-train leaves them for the owner to read (ADR-0060 §4).
#
# Security updates are deliberately NOT grouped (that needs `applies-to: security-updates`). They
# should keep arriving as their own immediate pull requests -- a CVE fix must never sit behind a
# broken major in a batch of thirty.
version: 2

updates:
  # .NET packages — versions are centrally managed in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # ONE pull request for every nuget update, majors included. Omitting `update-types` is what
      # does it: with the old ["minor","patch"] restriction a major matched no group at all and got
      # its own PR (#511 NSubstitute, #510 Npgsql+Serilog, #234, #233), so a quiet week still
      # produced four or five. Dependabot cannot merge across ecosystems, so three PRs a week --
      # nuget, github-actions, docker -- is the floor, and this brings us to it.
      # Trade-off, accepted deliberately: one breaking major now blocks the whole batch and there is
      # no way to merge the good half. The fix is an `ignore` entry for the offender (see below for
      # the working example), after which Dependabot rebuilds the PR without it.
      nuget:
        patterns: ["*"]
    ignore:
      # Microsoft.OpenApi 3.x cannot build on ASP.NET Core 10. Microsoft.AspNetCore.OpenApi 10.0.9
      # (the whole 10.x line) depends on Microsoft.OpenApi 2.0.0, and its bundled XmlCommentGenerator
      # emits `mediaType.Example = …` — a property 3.x turned read-only on IOpenApiMediaType, so the
      # generated file fails with CS0200 in both API projects (PR #390). The only reason dependabot
      # sees Microsoft.OpenApi at all is the direct 2.x pin that forces the GHSA-v5pm-xwqc-g5wc fix
      # into the graph. Drop this ignore when the apps move to .NET 11 (its preview OpenApi packages
      # are the first built against 3.x). Minor/patch 2.x updates still flow through the group above.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      # The .NET band (#1444): packages whose major follows .NET's. A new .NET major comes in a PR of
      # our own (CLAUDE.md), because some 11.0 packages break our net10.0 build (#1446: CS0757).
      # Minor and patch updates still come through the group above, with these limits:
      # - dotnet/extensions ships nothing on 10.x after 11.0.0, so Caching.Hybrid, Http.Resilience
      #   and TimeProvider.Testing stay at 10.11.0 until the move. Caching.Hybrid 11.0.0 needs the
      #   11.0.0 runtime packages. The other two would build on .NET 10; they are held so the family
      #   moves together (the owner's answer on #1444 named Microsoft.Extensions.* 11). To free one,
      #   replace `Microsoft.Extensions.*` with patterns that leave it out.
      # - A security fix that exists only on a new major may be held too. NuGetAudit fails the
      #   build only for a moderate or worse advisory.
      # - Only our own references are covered: OpenTelemetry 1.21 still brings
      #   System.Diagnostics.DiagnosticSource 11.0.0 with it.
      # A package that a pattern catches must really follow .NET's major (Microsoft.AspNetCore.OData,
      # on its own 9.x line, does not); otherwise narrow the pattern, or its major updates stop and
      # nothing shows it. A band package that no pattern covers joins the list. dotnet-ef keeps the
      # tool manifest on the EF Core major we run; the migrator images do not read the manifest yet
      # (#1448).
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.Extensions.Logging"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]

  # GitHub Actions referenced across every workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Container base images for the deployed services (root migrator/test images + the three apps).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/src/AuthSystem/LotroKoniecDev.AuthSystem.API"
      - "/src/TranslationSystem/LotroKoniecDev.TranslationSystem.API"
      - "/src/Frontend/LotroKoniecDev.Frontend"
    schedule:
      interval: "weekly"
    groups:
      docker-base-images:
        patterns: ["*"]
    ignore:
      # No new .NET major from Dependabot (#1444). The 11.0 sdk and aspnet images hold only .NET 11,
      # so they cannot run `dotnet ef`, the tests or our .NET 10 apps: the migrator build and the E2E
      # stacks fail with "You must install or update .NET". runtime-deps moves with them. A .NET
      # major comes in a PR of our own (CLAUDE.md). Digest refreshes of the 10.0 tags still come
      # through the group above. If a dotnet/* image with its own version line (such as
      # aspire-dashboard) joins a Dockerfile, list the three images by name instead.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  # Caddy, the proxy in front of both servers (#1001), and the observability images in
  # compose.observability.yaml (#1325). These images are only in compose files, which the `docker`
  # entry above does not read. How Caddy's pull request moves its pins: the comment above
  # `x-caddy-image` in compose.hetzner.yaml.
  # RabbitMQ and the backup's postgres stay manual: each has a second pin that Dependabot cannot
  # move (tests/Shared/RabbitMqImage.cs, scripts/hetzner/backup.sh). The daily image scan watches
  # them (ADR-0076). A postgres major also needs a data migration. The ghcr.io app images take their
  # tag from variables, and Dependabot skips them.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    # No CI check tests a pull request that changes only compose files. A new Caddy first runs on
    # staging after the merge (#988), and a new observability image runs only after the owner's hand
    # deploy (ADR-0050 §2). `on-hold` makes /merge-train skip both. The owner reads the pull request,
    # then removes the label. These names replace Dependabot's default labels, and a name that does
    # not exist in the repo is dropped without a warning, so each one must exist.
    labels: ["dependencies", "docker", "on-hold"]
    allow:
      - dependency-name: "caddy"
      - dependency-name: "grafana/grafana"
      - dependency-name: "grafana/loki"
      - dependency-name: "grafana/tempo"
      - dependency-name: "grafana/alloy"
      - dependency-name: "prom/prometheus"
      - dependency-name: "alpine"
    # One pull request for the observability stack, because it is deployed as one. Caddy is not in
    # the group, so it keeps its own pull request.
    groups:
      observability:
        patterns:
          - "grafana/grafana"
          - "grafana/loki"
          - "grafana/tempo"
          - "grafana/alloy"
          - "prom/prometheus"
          - "alpine"
    ignore:
      # 2.11.6 crashes the proxy (#988). This also covers the `2.11.6-alpine` tag we would pin:
      # Dependabot compares only the version part of a tag and drops the `-alpine` suffix.
      - dependency-name: "caddy"
        versions: ["2.11.6"]
      # A major of an observability component changes its config format, so it comes in a PR of our
      # own, with the config moved and booted locally. A minor can break config too (Alloy lists
      # breaking changes in minors), so the group's PR is booted locally before the hand deploy
      # (runbook → "The observability stack").
      - dependency-name: "grafana/*"
        update-types: ["version-update:semver-major"]
      # Grafana gets patches of the pinned minor only. From 13.2 on, most of its data sources are
      # separate programs built with older Go libraries, and the image scan fails on them. A new
      # minor comes in a PR of our own, after its scan is clean, and before Grafana stops patching
      # the pinned minor (ADR-0076, amendment of 2026-11-24).
      - dependency-name: "grafana/grafana"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "prom/prometheus"
        update-types: ["version-update:semver-major"]
      - dependency-name: "alpine"
        update-types: ["version-update:semver-major"]
