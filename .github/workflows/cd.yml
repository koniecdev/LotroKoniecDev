name: CD

# Continuous delivery + deployment for the TMS (ADR-0012, amended 2026-06-29 audit 0001 C2,
# 2026-06-30 audit 0001 H9 + H1 — supply-chain hardening: Trivy image gate + cosign signing + SLSA
# provenance/SBOM, verified before rollout; 2026-07-13 ADR-0034 / #490 — the rollout target moved
# from Azure Container Apps to the Hetzner boxes and the transport became ssh + docker compose).
#
#   gate           → CI-success gate. CD is TRIGGERED BY the CI workflow finishing (workflow_run); it
#                    proceeds only when CI concluded `success` on main, and pins the exact tested
#                    commit (head_sha) for everything downstream. Dispatch / v* tags pass through.
#   build-and-push → builds the four OCI images, scans each with Trivy (fail HIGH/CRITICAL), then
#                    publishes them to GHCR signed + attested (cosign + SLSA provenance/SBOM) — the
#                    deployment unit (ADR-0008 §1/§6; supply-chain hardening, audit 0001 H9 + H1).
#   deploy-staging → calls the reusable deploy.yml under environment: staging — AUTOMATIC (no gate),
#                    active once vars.STAGING_ENABLED is on (ADR-0018).
#   deploy-prod    → calls the SAME reusable deploy.yml under environment: production — GATED by the
#                    required-reviewer rule AND needs: deploy-staging, so the approval IS the
#                    staging→prod promotion of the artifact that just passed staging. The rollout
#                    itself lives in deploy.yml: verify provenance → cut the Neon pre-migration
#                    snapshot → ssh to the environment's box → pull + assert the attested digests →
#                    run the migrator as a GATE → `up -d` → smoke the public origins → roll images
#                    AND config back to the previous deploy on any failure.
#
# The deployment unit is an immutable per-commit image (`sha-<short>`), and the environment a job
# targets is ONE BOX (`lotro-staging` or `lotro-prod`, env-scoped var HETZNER_HOST) running
# compose.hetzner.yaml out of /opt/lotro. `latest` still tracks the tip of main for humans by hand.
#
# NOTE — there is no 0%-traffic candidate any more. The ACA health-gated rollout (audit 0001 H7)
# could smoke a candidate revision before shifting traffic; a 4 GB VPS cannot hold a second live set
# of three apps, so compose recreates containers in place and the smoke necessarily runs after they
# are live. What replaces it: the migration gate (deploy.sh runs the migrator as its OWN one-off
# container before any app container is recreated — a bad migration leaves the previous release
# serving) plus an automatic rollback of images AND config. Rationale and the discarded alternatives:
# deploy.yml's header + ADR-0034.
#
# Why ONE job per environment (not a job per phase): the `environment:` is what selects the box
# (HETZNER_HOST), its ssh key and its approval gate — so the whole rollout for an environment runs in
# a single job under that environment, and each rollout costs exactly ONE approval. (Under ACA the
# same shape was forced by the Azure OIDC federated credential, which trusted only a specific
# environment subject; the constraint is gone, the shape stays because it is still the right one.)
#
# Supply-chain hardening (audit 0001 H9 + the H1 image-scanning leg — the dependency/SAST legs already
# ship as NuGetAudit + CodeQL + Dependabot). Each image is scanned by Trivy and a fixable HIGH/CRITICAL
# fails the build BEFORE publish; the image is then signed keyless (cosign) and carries a signed SLSA
# build-provenance attestation + an SPDX SBOM, all attached in GHCR. The deploy job re-verifies that
# provenance (`gh attestation verify`) and fails closed, so only an image our own CD built, scanned and
# attested can reach an environment. No keys are stored — signing uses the job's GitHub OIDC identity (Fulcio/Rekor).
#
# CI is a hard pre-condition of deploy (audit 0001 C2): a push to main no longer triggers CD
# directly. CD waits for the CI workflow (Release build + unit + integration) to finish, and only a
# `success` conclusion lets the deploy candidate build/roll — testing is no longer a parallel race.
# A red or cancelled CI silently skips the deploy (the gate records why in the run summary). Because
# CI carries `paths-ignore` for docs, a docs-only push runs no CI and therefore triggers no CD (this
# also closes audit 0001 M2).
#
# Build images:
#   * CI success on main → :sha-<short> and :latest
#   * push of a v* tag   → :sha-<short>, :<major.minor.patch>, :<major.minor>  (latest is NOT moved; not CI-gated)
#
# Deploy: every green-CI commit on main auto-deploys to STAGING (deploy-staging, no gate) and then
# pauses at the `production` approval gate (deploy-prod) — the approval promotes the staging-verified
# artifact to prod. The approver sees the CI conclusion + deploying commit in the run summary before
# approving. A v* tag only publishes artifacts; it does not deploy. `workflow_dispatch` deploys on
# demand, still behind the same staging→prod flow (and not CI-gated). Until vars.STAGING_ENABLED is set,
# deploy-staging is skipped and prod deploys exactly as before (ADR-0018).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-1a2b3c4 or v1.2.3). Empty = the dispatched commit SHA.'
        required: false
        default: ''

# Least privilege at the top: read-only default. Every job below declares its own permissions block
# (a job-level block REPLACES this one), so nothing here actually grants packages: write — keeping the
# default read-only means a future job added WITHOUT a permissions block cannot silently publish to
# GHCR with the workflow token.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  # Per-environment deploy targets (HETZNER_HOST / HETZNER_SSH_KNOWN_HOSTS + the *_URL public origins)
  # live in environment-scoped GitHub vars (production / staging) and are consumed by the reusable
  # .github/workflows/deploy.yml — selected by the environment: each deploy job runs under (ADR-0018).
  # Only the build-time, env-agnostic values stay here.

jobs:
  # CI-success gate (audit 0001 C2). Reached via workflow_run, this decides whether the deploy
  # candidate may proceed AND pins the exact commit CI tested (head_sha) for build + rollout — so the
  # image content, its `sha-<short>` tag and the containers that end up running are all the same tested commit,
  # never main's tip if it raced ahead (which would otherwise re-open C2 under a push race). Manual
  # dispatch / v* tag publishes pass through ungated. workflow_run fields are read via env, never
  # interpolated into run: (the SHA is trusted hex, head_branch is allowlisted to main by the trigger).
  gate:
    name: CI gate (deploy candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.eval.outputs.proceed }}
      deploy_sha: ${{ steps.eval.outputs.deploy_sha }}
      short_sha: ${{ steps.eval.outputs.short_sha }}
    steps:
      - name: Evaluate trigger & CI conclusion
        id: eval
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          proceed=false
          deploy_sha="$FALLBACK_SHA"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            deploy_sha="$WR_SHA"
            if [ "$WR_CONCLUSION" = "success" ] && [ "$WR_BRANCH" = "main" ]; then
              proceed=true
              {
                echo "### ✅ CI gate passed — deploy candidate"
                echo ""
                echo "- CI run [#${WR_ID}](${WR_URL}) concluded **${WR_CONCLUSION}** on **${WR_BRANCH}**"
                echo "- Deploying commit \`${deploy_sha}\` — the exact commit CI tested"
                echo "- Rollout still pauses at the \`production\` approval gate below."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### ⏭️ Deploy skipped — CI did not pass"
                echo ""
                echo "- CI run [#${WR_ID}](${WR_URL}) concluded **${WR_CONCLUSION:-unknown}** on **${WR_BRANCH:-unknown}**"
                echo "- No image is built and no rollout is attempted."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # workflow_dispatch (deploy on demand) or a v* tag push (publish artifacts only).
            proceed=true
            {
              echo "### ▶️ ${EVENT_NAME} — not CI-gated"
              echo ""
              echo "- Commit \`${deploy_sha}\`"
              echo "- Manual dispatch / tag publish. Any rollout still requires approval."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          short_sha="$(printf '%s' "$deploy_sha" | cut -c1-7)"
          {
            printf 'proceed=%s\n' "$proceed"
            printf 'deploy_sha=%s\n' "$deploy_sha"
            printf 'short_sha=%s\n' "$short_sha"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push ${{ matrix.image }}
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Build-time supply-chain permissions (audit 0001 H9). A job-level block REPLACES the top-level one,
    # so it must re-grant contents/packages too: id-token mints the keyless Sigstore/Fulcio cert for
    # cosign + attestation; attestations records the signed SLSA provenance; packages writes the image
    # plus its signature/attestation to GHCR.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Supersede only an in-flight BUILD of the SAME image for the SAME tested commit (e.g. a CI
    # re-run) — keyed on the tested commit (workflow_run.head_sha, else github.sha for tag/dispatch),
    # NOT github.ref. Under workflow_run github.ref is always refs/heads/main, so a github.ref key
    # would make builds for *different* tested commits share one group and cancel each other — a green
    # commit could lose its image entirely. Deploys are serialized separately (deploy-prod has its own
    # non-cancelling group). The group MUST include matrix.image, else the four legs share one group
    # and cancel each other (only the last-started survives).
    concurrency:
      group: cd-build-${{ github.event.workflow_run.head_sha || github.sha }}-${{ matrix.image }}
      cancel-in-progress: true

    strategy:
      # Publish every image even if one fails, so a single flaky build doesn't mask the rest.
      fail-fast: false
      matrix:
        include:
          - image: lotrokoniecdev-auth-api
            dockerfile: src/AuthSystem/LotroKoniecDev.AuthSystem.API/Dockerfile
          - image: lotrokoniecdev-tms-api
            dockerfile: src/TranslationSystem/LotroKoniecDev.TranslationSystem.API/Dockerfile
          - image: lotrokoniecdev-frontend
            dockerfile: src/Frontend/LotroKoniecDev.Frontend/Dockerfile
          - image: lotrokoniecdev-migrator
            dockerfile: Dockerfile.migrator.prod

    steps:
      # Build the EXACT commit the gate pinned (the commit CI tested) — never main's tip. For a
      # workflow_run, the default checkout ref (github.sha) is the default branch's HEAD, which a
      # later push could have moved past the tested commit; pinning deploy_sha keeps build == tested.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.gate.outputs.deploy_sha }}
          # No later step does authenticated git — don't leave the workflow token (which in THIS job
          # carries packages: write) sitting in .git/config for every subsequent step.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Log in to GHCR with the workflow's own scoped token — no stored secret.
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          # `latest` is added explicitly below (main tip only — see the tags comment), never auto-applied.
          flavor: |
            latest=false
          # The sha tag is pinned to the gate's commit (the one CI tested), not github.sha — type=sha
          # would derive from github.sha, which for a workflow_run is main's tip and can race ahead of
          # the tested commit. `latest` likewise must NOT follow {{is_default_branch}} (true for ANY
          # main workflow_run, incl. a raced non-tip commit): it moves only when the tested commit IS
          # the current main tip (head_sha == github.sha), so latest never regresses to an older commit
          # under a push race (at worst it lags one tip whose newer sibling's CI is still red — harmless,
          # latest is human-pull convenience, never deployed). type=semver still reads github.ref
          # (emits only on a v* tag ref).
          tags: |
            type=raw,value=sha-${{ needs.gate.outputs.short_sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha == github.sha }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_CONFIGURATION=Release
          # Per-image GHA layer cache so unchanged layers (restore/build) are reused across runs,
          # keeping rebuilds fast. Scoped per image so the four builds don't clobber each other.
          # ignore-error=true: the cache EXPORT is a build-speed optimization, not a correctness step —
          # by the time layers export, the image is already built AND pushed to GHCR. The GHA cache
          # backend intermittently 404s a single large-layer blob under API throttling (moby/buildkit
          # #2408/#2276/#2804); that blip must not fail the job and block the deploy. It did once — run
          # 28515436800, tms-api leg only, while the three sibling legs exported the same cache fine at
          # the same moment. A flake now degrades to a warning and the next run re-exports the cache.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
          # Attach build attestations to the image in GHCR (audit 0001 H9): SLSA provenance (build
          # inputs/invocation) + an SPDX SBOM (package inventory for CVE triage). These ride along as
          # OCI referrer manifests, so the push is an image INDEX — the linux/amd64 runtime manifest
          # plus two `unknown/unknown` attestation manifests. The box's Docker engine platform-matches
          # the amd64 entry and ignores the attestation manifests, so the rollout pull is unchanged.
          provenance: true
          sbom: true

      # Image vulnerability gate (audit 0001 H1 — image-scanning leg; the dependency/SAST legs already
      # ship as NuGetAudit + CodeQL + Dependabot). Scan the exact pushed artifact BY DIGEST and FAIL on
      # a fixable HIGH/CRITICAL, before the image is signed — a vulnerable image never gets a signature
      # nor reaches prod. ignore-unfixed: a CVE with no upstream fix can't be actioned here (it would
      # only force a perpetual red gate); those still print in Trivy's log, they just don't block.
      - name: Scan image for vulnerabilities (Trivy — fail HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          # Pull the just-pushed image from GHCR with the workflow's own token (same creds as the push).
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature over the image DIGEST (audit 0001 H9). cosign mints a short-lived Fulcio cert
      # from the job's GitHub OIDC token (no stored key) and records the signature in the Rekor
      # transparency log; the signature is stored next to the image in GHCR. Signing by digest (not tag)
      # binds the signature to immutable content.
      - name: Sign image with cosign (keyless)
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      # Signed SLSA build provenance (audit 0001 H9) — GitHub's first-party artifact attestation, also
      # Sigstore-backed. push-to-registry stores it as an OCI referrer so it travels with the image and
      # can be enforced at deploy (`gh attestation verify`, see deploy-prod) or by an admission controller.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Deploy to STAGING — AUTOMATIC (the `staging` environment has no protection rule). Calls the reusable
  # deploy.yml, which runs the full health-gated rollout under environment: staging (its own vars/secrets
  # + the gh-env-staging federated credential). Gated by STAGING_ENABLED so this is a no-op until staging
  # infra is live; once flipped on, every green-CI commit auto-deploys to staging (ADR-0018).
  deploy-staging:
    name: Deploy to staging
    needs: [gate, build-and-push]
    if: >-
      vars.CD_ENABLED == 'true'
      && vars.STAGING_ENABLED == 'true'
      && needs.gate.outputs.proceed == 'true'
      && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      deploy_sha: ${{ needs.gate.outputs.deploy_sha }}
      short_sha: ${{ needs.gate.outputs.short_sha }}
      image_tag: ${{ github.event.inputs.image_tag }}
    secrets: inherit

  # Promote to PRODUCTION — behind the `production` approval gate AND only after staging is green
  # (needs: deploy-staging). The approval click IS the staging→prod promotion of the same artifact
  # (the sha-<short> that passed staging). always() + the (success||skipped) guard keep prod deploying
  # UNCHANGED while STAGING_ENABLED is false (deploy-staging is skipped, not a blocker); with staging on,
  # a red staging rollout/smoke leaves deploy-staging != success and blocks the promotion (ADR-0018).
  # The explicit build-and-push success guard is required because always() drops the default
  # skip-on-failed-need behaviour.
  deploy-prod:
    name: Deploy to prod
    needs: [gate, build-and-push, deploy-staging]
    if: >-
      always()
      && vars.CD_ENABLED == 'true'
      && needs.gate.outputs.proceed == 'true'
      && needs.build-and-push.result == 'success'
      && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
      && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      deploy_sha: ${{ needs.gate.outputs.deploy_sha }}
      short_sha: ${{ needs.gate.outputs.short_sha }}
      image_tag: ${{ github.event.inputs.image_tag }}
    secrets: inherit
