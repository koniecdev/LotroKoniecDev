# Loki — single-binary, filesystem-backed, one tenant. Sized for two small boxes, not a fleet.
#
# Retention is the part that is easy to get silently wrong (ADR-0050 §8): `retention_period` alone
# is a NO-OP. The compactor is what deletes, `compactor.retention_enabled` defaults to false, and a
# missing `delete_request_store` makes the compactor refuse to start. So the loud failure is safe
# and the silent one is not — which is why the deploy checks the RENDERED config rather than
# trusting this comment.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 14 days.
  retention_period: 336h
  # Loki has NO size-based retention, so the inflow is bounded instead. The per-stream limit is the
  # one that matters: it stops a single crash-looping container from filling the disk in minutes
  # while every other stream keeps flowing.
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  per_stream_rate_limit: 128KB
  per_stream_rate_limit_burst: 512KB
  max_global_streams_per_user: 1000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

analytics:
  reporting_enabled: false
