# ONE delivery channel across both projects (#713). E-mail over the Brevo relay the apps already
# send through. The from-address must be on a domain authenticated in Brevo; any other may be
# refused or dropped with no error here (docs/deployment/runbook.md → "E-mail deliverability").
apiVersion: 1

contactPoints:
  - orgId: 1
    name: owner-email
    receivers:
      - uid: owner-email
        type: email
        settings:
          addresses: $OBS_ALERT_EMAIL
          singleEmail: false
