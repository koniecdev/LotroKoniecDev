name: Smoke test

# The smoke test (M6-13) started by hand against staging or production: health, an OIDC token
# round-trip, tms accepting the token, the translation-file download and the CSP legs. CD does not
# call this file: deploy.yml runs scripts/smoke.sh inside its own rollout job, so a red result can
# roll the box back.
#
# The job reads the environment's own SMOKE_CLIENT_SECRET and AUTH_URL / TMS_URL / FRONTEND_URL,
# the same values CD uses, so the two runs cannot drift apart (#1335). `deployment: false` keeps it
# out of the deployment history: image-scan.yml and the N-1 promotion gate (#534) read the newest
# successful deployment to learn what runs on a box. A production run still waits at the
# `production` reviewer gate. Runbook: "Post-deploy smoke test" → "In CI".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to smoke'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    # smoke.sh makes about 16 requests of up to SMOKE_TIMEOUT each. Against a box that hangs, this
    # still lets it print its own result.
    timeout-minutes: 10
    # No concurrency group: a pending job in deploy.yml's `*-mutation` group would cancel another
    # pending one, so a smoke there could push out a queued deploy.
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every value goes through the environment, never into the run: script, so the secret never
      # reaches argv or a log line. smoke.sh reads each SMOKE_* variable as its fallback for the flag.
      - name: Run smoke test
        env:
          SMOKE_AUTH_URL: ${{ vars.AUTH_URL }}
          SMOKE_TMS_URL: ${{ vars.TMS_URL }}
          SMOKE_FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          SMOKE_CLIENT_SECRET: ${{ secrets.SMOKE_CLIENT_SECRET }}
          # Only a Development stack serves no CSP on purpose (#670), and this targets deployed ones.
          SMOKE_REQUIRE_CSP: '1'
          # The same per-request limit as deploy.yml's smoke: a frontend just restarted is a cold
          # .NET app.
          SMOKE_TIMEOUT: '30'
        run: ./scripts/smoke.sh
